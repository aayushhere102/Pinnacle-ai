/* ---------- ORAL TEST RUNNER (AI Voice Exam) ---------- */
async function startOralTest(){
  const c = S.chapters.find(ch=>ch.id===S.activeChapterId);
  go('oralRunner', {_oral:{chapterId:c.id, status:'loading', qIndex:0, results:[], timeLeft:10}});
  try{
    const data = await callAIJson("You write spoken viva/oral exam questions.", `${chapterCtx(c)}\n\nReturn JSON array of 6 short oral exam questions (answerable in one or two spoken sentences): [{"q":"...","modelAnswer":"<=25 words ideal spoken answer"}].`, 800);
    S._oral.status='active';
    S._oral.questions = Array.isArray(data) ? data : [];
    if(S._oral.questions.length===0) throw new Error("Couldn't prepare oral questions. Try again.");
    render();
    speakOralQuestion();
  }catch(e){ S._oral.status='error'; S._oral.error = e.message; render(); }
}

function speakOralQuestion(){
  const o = S._oral;
  const q = o.questions[o.qIndex];
  try{
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(q.q);
    utter.lang = 'en-IN'; utter.rate = 0.95;
    utter.onend = ()=> startOralTimer();
    window.speechSynthesis.speak(utter);
  }catch(e){ startOralTimer(); }
}

let oralTimerInterval = null;
function startOralTimer(){
  clearInterval(oralTimerInterval);
  S._oral.timeLeft = 10;
  const el = document.getElementById('oralTimer');
  if(el) el.textContent = S._oral.timeLeft;
  oralTimerInterval = setInterval(()=>{
    S._oral.timeLeft--;
    const el2 = document.getElementById('oralTimer');
    if(el2) el2.textContent = Math.max(0, S._oral.timeLeft);
    if(S._oral.timeLeft<=0){ clearInterval(oralTimerInterval); submitOralAnswer(true); }
  }, 1000);
}

function ScreenOralRunner(){
  const o = S._oral;
  if(o.status==='loading') return `<div class="topbar"><button class="back-btn" onclick="exitOral()">←</button><h2>Preparing Oral Exam</h2><div style="width:38px;"></div></div><div class="scr">${loadingBlock()}</div>`;
  if(o.status==='error') return `<div class="topbar"><button class="back-btn" onclick="exitOral()">←</button><h2>Oral Exam</h2><div style="width:38px;"></div></div><div class="scr"><div class="empty-state"><div class="ei">⚠️</div><p>${esc(o.error)}</p><button class="btn btn-primary" onclick="startOralTest()">Retry</button></div></div>`;
  if(o.status==='done') return renderOralResult(o);

  const q = o.questions[o.qIndex];
  return `<div class="topbar"><button class="back-btn" onclick="exitOral()">←</button><h2>Oral Q${o.qIndex+1}/${o.questions.length}</h2><div style="width:38px;"></div></div>
  <div class="scr" style="padding-top:6px;">
    <div class="courtroom" style="padding:22px 16px;">
      <div style="text-align:center; font-size:11px; letter-spacing:.08em; color:var(--gold); font-weight:700; margin-bottom:10px;">🎓 AI ORAL EXAMINER</div>
      <div class="court-question"><div class="court-qnum">QUESTION ${o.qIndex+1}</div>${esc(q.q)}
        <div style="margin-top:10px;"><button class="btn btn-sm" style="background:rgba(255,255,255,.12); color:#fff;" onclick="speakOralQuestion()">🔊 Replay Question</button></div>
      </div>
      <div style="text-align:center; margin-top:18px;">
        <div style="font-size:34px; font-weight:800; font-family:var(--font-mono); color:#fff;" id="oralTimer">${o.timeLeft}</div>
        <div class="muted" style="font-size:11px; color:rgba(255,255,255,.6);">seconds left to answer</div>
      </div>
      <div style="text-align:center; margin:18px 0 6px;">
        <button class="mic-btn" id="oralMicBtn" onclick="toggleOralMic()">🎤</button>
        <div class="muted" id="oralVoiceStatus" style="margin-top:8px; font-size:12.5px; color:rgba(255,255,255,.7);">Tap to speak your answer</div>
      </div>
      <textarea id="oralTextFallback" placeholder="Or type your answer..." style="width:100%; min-height:60px; margin-top:8px;"></textarea>
      <button class="btn btn-block" style="margin-top:12px; background:linear-gradient(135deg,var(--gold),var(--gold-deep)); color:#1d1830;" onclick="submitOralAnswer(false)">Submit Answer</button>
    </div>
  </div>`;
}

let oralRecognition = null;
function toggleOralMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ document.getElementById('oralVoiceStatus').textContent="Voice not supported here — please type your answer below."; return; }
  const micBtn = document.getElementById('oralMicBtn');
  if(oralRecognition){ oralRecognition.stop(); return; }
  oralRecognition = new SR();
  oralRecognition.lang = 'en-IN'; oralRecognition.interimResults = false;
  micBtn.classList.add('listening');
  document.getElementById('oralVoiceStatus').textContent = "Listening...";
  oralRecognition.onresult = (ev)=>{
    const transcript = ev.results[0][0].transcript;
    document.getElementById('oralTextFallback').value = transcript;
    document.getElementById('oralVoiceStatus').textContent = `Heard: "${transcript}"`;
  };
  oralRecognition.onerror = ()=>{ document.getElementById('oralVoiceStatus').textContent = "Didn't catch that — type below instead."; };
  oralRecognition.onend = ()=>{ micBtn.classList.remove('listening'); oralRecognition=null; };
  oralRecognition.start();
}

async function submitOralAnswer(timedOut){
  clearInterval(oralTimerInterval);
  if(oralRecognition){ try{oralRecognition.stop();}catch(e){} }
  const o = S._oral;
  const ansEl = document.getElementById('oralTextFallback');
  const answer = ansEl ? ansEl.value.trim() : '';
  const q = o.questions[o.qIndex];
  document.querySelector('.courtroom').innerHTML = `<div class="ai-loading"><div class="spinner"></div><div class="muted" id="aiStatusText" style="color:rgba(255,255,255,.7);">Evaluating your answer...</div></div>`;
  let evalResult = {score:0, feedback:"No answer given."};
  if(answer){
    try{
      evalResult = await callAIJson("You are an oral examiner grading spoken answers leniently but fairly.", `Question: ${q.q}\nModel Answer: ${q.modelAnswer}\nStudent's spoken answer: ${answer}\n\nReturn JSON {"score":0-100,"feedback":"<=15 words, encouraging tone"}.`, 300);
    }catch(e){ evalResult = {score:0, feedback:"Couldn't evaluate — moving on."}; }
  } else if(timedOut){ evalResult = {score:0, feedback:"Time's up — no answer recorded."}; }
  o.results.push({q:q.q, answer, score:evalResult.score, feedback:evalResult.feedback});
  if(evalResult.score>=70) await grantYuh(2, "Correct Oral Answer", {silent:true});
  if(o.qIndex < o.questions.length-1){
    o.qIndex++; render(); speakOralQuestion();
  } else {
    await finishOralTest();
  }
}

async function finishOralTest(){
  const o = S._oral;
  const c = S.chapters.find(ch=>ch.id===o.chapterId);
  const avg = o.results.reduce((a,b)=>a+(b.score||0),0)/o.results.length;
  o.status='done'; o.avgScore = avg;
  S.testHistory.push({id:uid(), chapterId:c.id, chapterName:c.name, type:'oral', label:'Oral Exam', score:avg, date:new Date().toISOString()});
  await persistTests();
  const baseYuh = Math.round(40*(avg/100));
  await grantYuh(Math.max(baseYuh,5), "Oral Exam Completed", {silent:true});
  await grantYuh(8, "Oral Test Bonus");
  await checkAchievements();
  render();
}
function exitOral(){ clearInterval(oralTimerInterval); if(oralRecognition){try{oralRecognition.stop();}catch(e){}} try{window.speechSynthesis.cancel();}catch(e){} go('tests'); }

function renderOralResult(o){
  return `<div class="topbar"><button class="back-btn" onclick="go('tests')">←</button><h2>Oral Exam Result</h2><div style="width:38px;"></div></div>
  <div class="scr">
    <div class="card glass" style="text-align:center; padding:28px 18px;">
      <div style="font-size:13px; color:var(--grey-500); margin-bottom:6px;">Average Score</div>
      <div style="font-size:42px; font-weight:800; color:var(--purple-700);">${Math.round(o.avgScore)}%</div>
    </div>
    <div class="section-title">Per-Question Feedback</div>
    ${o.results.map((r,i)=>`<div class="card content-block">
      <div style="font-weight:600; font-size:13.5px; margin-bottom:5px;">${i+1}. ${esc(r.q)}</div>
      <div class="muted" style="font-size:12px; margin-bottom:4px;">Your answer: ${esc(r.answer||'(no answer)')}</div>
      <div style="font-size:12.5px; font-weight:700; color:var(--purple-600);">Score: ${Math.round(r.score)}% — ${esc(r.feedback)}</div>
    </div>`).join('')}
    <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="go('tests')">Back to Tests</button>
  </div>`;
}
</script>

<script>
/* =========================================================================
   AI DEBATE — Courtroom mode. User vs AI, judged by an AI judge.
   ========================================================================= */
function ScreenDebateLobby(){
  if(S.chapters.length===0){
    return `<div class="topbar"><h2>AI Debate</h2></div><div class="scr"><div class="empty-state"><div class="ei">⚖️</div><p>Add a chapter from Study tab first — debates are topic-based.</p><button class="btn btn-primary" onclick="go('study')">Go to Study</button></div></div>`;
  }
  if(!S.activeChapterId) S.activeChapterId = S.chapters[S.chapters.length-1].id;
  const mode = S._tmp.debateMode || 'easy';

  return `<div class="topbar"><button class="back-btn" onclick="go('dashboard')">←</button><h2>AI Debate</h2><div style="width:38px;"></div></div>
  <div class="scr" style="padding-top:6px;">
    <div class="courtroom" style="margin-bottom:18px; padding:24px 16px;">
      <div class="court-bench">
        <div class="judge-avatar">⚖️</div>
        <div class="judge-label">AI Judge presiding</div>
        <div class="gavel">🔨 Order in the court</div>
      </div>
      <p style="text-align:center; font-size:12.5px; color:rgba(255,255,255,.75); margin-top:8px;">Argue your answers. The judge scores both sides — highest average wins the gavel.</p>
    </div>

    <div class="section-title">Topic / Chapter</div>
    <div class="chip-group" style="margin-bottom:6px;">
      ${S.chapters.map(c=>`<button class="chip ${c.id===S.activeChapterId?'active':''}" onclick="S.activeChapterId='${c.id}'; render();">${esc(c.name)}</button>`).join('')}
    </div>

    <div class="section-title">Select Mode</div>
    ${DEBATE_MODES.map(m=>`<div class="mode-card ${mode===m.id?'sel':''}" onclick="setDebateMode('${m.id}')">
      <div class="mode-dot" style="background:${m.color};">${m.label[0]}</div>
      <div style="flex:1;">
        <div style="font-weight:700; font-size:14px;">${m.label}</div>
        <div class="muted" style="font-size:11.5px;">${m.desc} · 20 questions</div>
      </div>
      <div style="text-align:right; font-family:var(--font-mono); font-weight:800; font-size:13px; color:${m.color};">±${m.reward}<div style="font-size:9px; color:var(--grey-400); font-weight:600;">YUH</div></div>
    </div>`).join('')}

    <button class="btn btn-primary btn-block" style="margin-top:14px; background:linear-gradient(135deg,#5d33ab,#2b2440);" onclick="startDebate()">⚖️ Start Debate</button>
  </div>`;
}
function setDebateMode(m){ S._tmp.debateMode = m; render(); }

async function startDebate(){
  const c = S.chapters.find(ch=>ch.id===S.activeChapterId);
  const modeId = S._tmp.debateMode || 'easy';
  const mode = DEBATE_MODES.find(m=>m.id===modeId);
  go('debateRunner', {_debate:{chapterId:c.id, modeId, status:'loading', qIndex:0, userTotal:0, aiTotal:0, rounds:[]}});
  try{
    const difficultyDesc = {easy:'simple, direct, basic recall', medium:'applied understanding, moderate reasoning', hard:'tricky, multi-step reasoning, common misconceptions', veryhard:'expert-level, competitive-exam intensity, nuanced edge cases'}[modeId];
    const questions = await callAIJson("You are setting questions for a courtroom-style academic debate game.", `${chapterCtx(c)}\n\nDifficulty: ${mode.label} (${difficultyDesc}).\nReturn a JSON array of exactly 20 short debate questions (each under 18 words) testing this chapter at that difficulty: ["question 1", "question 2", ...]`, 1000);
    S._debate.questions = Array.isArray(questions) ? questions.slice(0,20) : [];
    if(S._debate.questions.length===0) throw new Error("Judge couldn't prepare questions. Try again.");
    S._debate.status='active';
    render();
  }catch(e){ S._debate.status='error'; S._debate.error=e.message; render(); }
}

function ScreenDebateRunner(){
  const d = S._debate;
  const c = S.chapters.find(ch=>ch.id===d.chapterId);
  if(d.status==='loading') return `<div class="topbar"><button class="back-btn" onclick="exitDebate()">←</button><h2>Courtroom</h2><div style="width:38px;"></div></div><div class="scr"><div class="courtroom"><div class="ai-loading"><div class="spinner"></div><div class="muted" id="aiStatusText" style="color:rgba(255,255,255,.7);">Judge is preparing the case file...</div></div></div></div>`;
  if(d.status==='error') return `<div class="topbar"><button class="back-btn" onclick="exitDebate()">←</button><h2>Courtroom</h2><div style="width:38px;"></div></div><div class="scr"><div class="empty-state"><div class="ei">⚠️</div><p>${esc(d.error)}</p><button class="btn btn-primary" onclick="startDebate()">Retry</button></div></div>`;

  const mode = DEBATE_MODES.find(m=>m.id===d.modeId);
  const q = d.questions[d.qIndex];
  const userInitial = (S.profile.name||'U')[0].toUpperCase();
  const userAvgNow = d.rounds.length ? Math.round(d.userTotal/d.rounds.length) : 0;
  const aiAvgNow = d.rounds.length ? Math.round(d.aiTotal/d.rounds.length) : 0;

  return `<div class="topbar"><button class="back-btn" onclick="exitDebate()">←</button><h2>Round ${d.qIndex+1}/20</h2><div style="width:38px;"></div></div>
  <div class="scr" style="padding-top:6px;">
    <div class="courtroom">
      <div class="court-bench">
        <div class="judge-avatar">⚖️</div>
        <div class="judge-label">${mode.label} Mode</div>
      </div>
      <div class="vs-row">
        <div class="duel-side">
          <div class="duel-avatar user">${userInitial}</div>
          <div class="duel-name">${esc(S.profile.name.split(' ')[0])}</div>
          <div class="duel-score">${userAvgNow}%</div>
        </div>
        <div class="vs-mid">VS</div>
        <div class="duel-side">
          <div class="duel-avatar ai">🤖</div>
          <div class="duel-name">AI</div>
          <div class="duel-score">${aiAvgNow}%</div>
        </div>
      </div>
      <div class="court-question">
        <div class="court-qnum">QUESTION ${d.qIndex+1} OF 20</div>
        ${esc(q)}
      </div>
      <div class="court-answerbox" style="margin-top:12px;">
        <textarea id="debateAnswer" placeholder="Present your argument / answer..."></textarea>
      </div>
      <button class="btn btn-block" id="debateSubmitBtn" style="margin-top:12px; background:linear-gradient(135deg,var(--gold),var(--gold-deep)); color:#1d1830;" onclick="submitDebateRound()">Submit to Judge 🔨</button>
      <div id="verdictArea"></div>
    </div>
  </div>`;
}

async function submitDebateRound(){
  const d = S._debate;
  const c = S.chapters.find(ch=>ch.id===d.chapterId);
  const mode = DEBATE_MODES.find(m=>m.id===d.modeId);
  const q = d.questions[d.qIndex];
  const userAnswer = document.getElementById('debateAnswer').value.trim();
  document.getElementById('debateSubmitBtn').disabled = true;
  document.getElementById('verdictArea').innerHTML = `<div class="ai-loading" style="padding:24px 0;"><div class="spinner"></div><div class="muted" id="aiStatusText" style="color:rgba(255,255,255,.7); font-size:13px;">Judge is deliberating...</div></div>`;
  try{
    const difficultyDesc = {easy:'a basic student level', medium:'a moderately well-prepared student', hard:'a sharp, well-revised student', veryhard:'a top competitive-exam-level student'}[d.modeId];
    const result = await callAIJson(
      "You are an impartial AI courtroom judge scoring an academic debate between a student and an AI opponent.",
      `${chapterCtx(c)}\nQuestion: "${q}"\nStudent's answer: "${userAnswer||'(no answer given)'}"\n\nFirst, write your own AI-opponent answer to this same question, written at the level of ${difficultyDesc}'s opponent (not perfect — realistic). Then score BOTH the student's answer and your AI answer for correctness/completeness on a 0-100 scale. Return ONLY JSON: {"aiAnswer":"<=35 words","userScore":0-100,"aiScore":0-100,"verdict":"<=18 words judge's remark"}`,
      450
    );
    const userScore = Math.max(0, Math.min(100, Math.round(result.userScore||0)));
    const aiScore = Math.max(0, Math.min(100, Math.round(result.aiScore||0)));
    d.userTotal += userScore; d.aiTotal += aiScore;
    d.rounds.push({q, userAnswer, userScore, aiAnswer:result.aiAnswer, aiScore, verdict:result.verdict});
    const won = userScore > aiScore;
    const tie = userScore === aiScore;
    document.getElementById('verdictArea').innerHTML = `
      <div class="ai-bubble" style="background:rgba(255,255,255,.08); color:#fff; margin-top:10px;">🤖 AI's answer: ${esc(result.aiAnswer)}</div>
      <div class="verdict-row">
        <div class="verdict-box ${won?'win':(tie?'':'lose')}"><div class="vv">${userScore}%</div><div style="font-size:10.5px; opacity:.8;">You</div></div>
        <div class="verdict-box ${!won&&!tie?'win':(tie?'':'lose')}"><div class="vv">${aiScore}%</div><div style="font-size:10.5px; opacity:.8;">AI</div></div>
      </div>
      <div style="text-align:center; font-size:12px; color:var(--gold); margin-top:8px; font-style:italic;">"${esc(result.verdict||'')}"</div>
      <button class="btn btn-block" style="margin-top:14px; background:#fff; color:var(--purple-700);" onclick="nextDebateRound()">${d.qIndex<19?'Next Question →':'See Final Verdict 🔨'}</button>
    `;
  }catch(e){
    document.getElementById('verdictArea').innerHTML = `<div class="muted" style="color:#ffb4b4; margin-top:10px;">⚠️ ${esc(e.message)} </div><button class="btn btn-block" style="margin-top:10px;" onclick="submitDebateRound()">Retry</button>`;
    document.getElementById('debateSubmitBtn').disabled = false;
  }
}
function nextDebateRound(){
  const d = S._debate;
  if(d.qIndex < 19){ d.qIndex++; render(); }
  else { finishDebate(); }
}

async function finishDebate(){
  const d = S._debate;
  const c = S.chapters.find(ch=>ch.id===d.chapterId);
  const mode = DEBATE_MODES.find(m=>m.id===d.modeId);
  const userAvg = d.userTotal/d.rounds.length;
  const aiAvg = d.aiTotal/d.rounds.length;
  let result = userAvg>aiAvg ? 'win' : (userAvg<aiAvg ? 'lose' : 'tie');
  let yuhChange = result==='win' ? mode.reward : (result==='lose' ? -mode.reward : 0);
  S.debateHistory.push({id:uid(), chapterId:c.id, chapterName:c.name, mode:d.modeId, userAvg, aiAvg, result, yuhChange, date:new Date().toISOString()});
  await persistDebate();
  if(yuhChange!==0) await grantYuh(yuhChange, result==='win' ? `Debate Won (${mode.label})` : `Debate Lost (${mode.label})`);
  await checkAchievements();
  go('debateResult', {_debateResultData:{userAvg, aiAvg, result, mode, rounds:d.rounds, chapterName:c.name}});
}

function ScreenDebateResult(){
  const r = S._debateResultData;
  const won = r.result==='win';
  const tie = r.result==='tie';
  return `<div class="topbar"><button class="back-btn" onclick="go('dashboard')">←</button><h2>Final Verdict</h2><div style="width:38px;"></div></div>
  <div class="scr">
    <div class="courtroom" style="text-align:center; padding:34px 18px;">
      <div style="font-size:46px;">${won?'🏆':tie?'🤝':'⚖️'}</div>
      <h2 style="color:#fff; margin:10px 0 4px;">${won?'You Win the Case!':tie?"It's a Tie":'The AI Wins This Round'}</h2>
      <div class="muted" style="color:rgba(255,255,255,.7); font-size:13px; margin-bottom:18px;">${esc(r.chapterName)} · ${r.mode.label} Mode</div>
      <div class="verdict-row">
        <div class="verdict-box ${won?'win':''}"><div class="vv">${Math.round(r.userAvg)}%</div><div style="font-size:10.5px; opacity:.8;">Your Average</div></div>
        <div class="verdict-box ${!won&&!tie?'win':''}"><div class="vv">${Math.round(r.aiAvg)}%</div><div style="font-size:10.5px; opacity:.8;">AI Average</div></div>
      </div>
      <div style="margin-top:16px; font-family:var(--font-mono); font-weight:800; font-size:20px; color:${won?'var(--green)':tie?'var(--gold)':'var(--red)'};">${won?'+':tie?'':'-'}${tie?0:r.mode.reward} YUH</div>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="go('dashboard')">Back to Dashboard</button>
    <button class="btn btn-secondary btn-block" style="margin-top:10px;" onclick="go('debateLobby')">⚖️ Debate Again</button>
  </div>`;
}
function exitDebate(){
  if(S._debate && S._debate.status==='active' && S._debate.rounds && S._debate.rounds.length>0){
    if(!confirm('Debate abhi chalu hai — chhod ke jaana hai? Progress save nahi hoga is round ka.')) return;
  }
  go('debateLobby');
}
</script>

<script>
/* =========================================================================
   SMART PLANNER — works correctly for BOTH 7-day and 30-day plans
   (deterministic local scheduling — no reliance on AI to count days right,
   which is exactly the class of bug being fixed here)
   ========================================================================= */
const PLAN_ACTIVITIES = ["Read Summary","Revise Notes","Practice Flashcards","Learn Definitions","Attempt MCQ Test","Oral Practice Round","Formula Sheet Review","AI Doubt Solving Session"];

function ScreenPlanner(){
  const days = S._tmp.planDays || 7;
  return `<div class="topbar"><h2>Smart Planner</h2></div>
  <div class="scr" style="padding-top:6px;">
    <div class="card glass" style="margin-bottom:18px;">
      <div style="font-weight:700; margin-bottom:10px; font-size:14.5px;">Create a new study plan</div>
      <div class="toggle-row">
        <button class="${days===7?'active':''}" onclick="setPlanDays(7)">7-Day Plan</button>
        <button class="${days===30?'active':''}" onclick="setPlanDays(30)">30-Day Plan</button>
      </div>
      <div class="muted" style="font-size:12px; margin-bottom:12px;">${S.chapters.length} chapter${S.chapters.length===1?'':'s'} will be cycled across ${days} days. Exam countdown supported below.</div>
      <div class="field" style="margin-bottom:10px;"><label>Exam Date (optional)</label><input type="date" id="examDate"></div>
      <button class="btn btn-primary btn-block" onclick="generatePlan()">📅 Generate ${days}-Day Plan</button>
    </div>

    ${S.plans.length===0 ? `<div class="empty-state"><div class="ei">📅</div><p>No plans yet — create your first one above.</p></div>` : ''}
    ${S.plans.slice().reverse().map(p=>renderPlanCard(p)).join('')}
  </div>`;
}
function setPlanDays(n){ S._tmp.planDays = n; render(); }

async function generatePlan(){
  if(S.chapters.length===0){ alert('Pehle Study tab se ek chapter add karo'); return; }
  const days = S._tmp.planDays || 7;
  const examDateVal = document.getElementById('examDate').value;
  const entries = [];
  const startDate = new Date();
  for(let i=0;i<days;i++){
    const date = new Date(startDate); date.setDate(date.getDate()+i);
    const chapter = S.chapters[i % S.chapters.length];
    const isRevisionDay = (i+1) % 7 === 0; // every 7th day = revision/test day
    let tasks = [];
    if(isRevisionDay){
      tasks = [
        {subject:chapter.subject, chapter:chapter.name, activity:"Full Revision of past chapters"},
        {subject:chapter.subject, chapter:chapter.name, activity:"Attempt a Written Test"}
      ];
    } else {
      const act1 = PLAN_ACTIVITIES[i % PLAN_ACTIVITIES.length];
      const act2 = PLAN_ACTIVITIES[(i+3) % PLAN_ACTIVITIES.length];
      tasks = [
        {subject:chapter.subject, chapter:chapter.name, activity:act1},
        {subject:chapter.subject, chapter:chapter.name, activity:act2}
      ];
    }
    entries.push({day:i+1, date:date.toISOString().slice(0,10), tasks, done:false});
  }
  const plan = { id:uid(), days, startDate:startDate.toISOString().slice(0,10), examDate:examDateVal||null, chapterIds:S.chapters.map(c=>c.id), entries };
  S.plans.push(plan);
  await persistPlans();
  await checkAchievements();
  render();
}

function renderPlanCard(p){
  const today = new Date().toISOString().slice(0,10);
  const daysLeft = p.examDate ? Math.ceil((new Date(p.examDate)-new Date())/(1000*3600*24)) : null;
  const completedDays = p.entries.filter(e=>e.done).length;
  return `<div class="card" style="margin-bottom:16px;">
    <div class="row between" style="margin-bottom:10px;">
      <div>
        <div style="font-weight:800; font-size:14.5px;">${p.days}-Day Plan</div>
        <div class="muted" style="font-size:11.5px;">Started ${esc(p.startDate)} ${daysLeft!==null?`· Exam in ${daysLeft}d`:''}</div>
      </div>
      <button class="icon-btn" style="width:32px;height:32px;font-size:13px;" onclick="deletePlan('${p.id}')">🗑️</button>
    </div>
    <div class="progress-track" style="margin-bottom:12px;"><div class="progress-fill" style="width:${(completedDays/p.days)*100}%"></div></div>
    <div style="max-height:340px; overflow-y:auto;">
    ${p.entries.map(e=>`<div class="day-card" style="${e.date===today?'border-color:var(--purple-400); background:var(--purple-50);':''}">
      <div class="day-head">
        <div class="dn">Day ${e.day} ${e.date===today?'· Today':''}</div>
        <div class="dd">${esc(e.date)}</div>
      </div>
      ${e.tasks.map(t=>`<div class="plan-task"><input type="checkbox" ${e.done?'checked':''} onchange="togglePlanDay('${p.id}',${e.day})"><div><b>${esc(t.subject)}</b> — ${esc(t.chapter)}: ${esc(t.activity)}</div></div>`).join('')}
    </div>`).join('')}
    </div>
  </div>`;
}
async function togglePlanDay(planId, day){
  const p = S.plans.find(pl=>pl.id===planId);
  const e = p.entries.find(en=>en.day===day);
  e.done = !e.done;
  await persistPlans();
  if(e.done) await grantYuh(3, "Plan Day Completed");
  render();
}
async function deletePlan(id){
  if(!confirm('Yeh plan delete karna hai?')) return;
  S.plans = S.plans.filter(p=>p.id!==id);
  await persistPlans();
  render();
}
</script>

<script>
/* =========================================================================
   PROGRESS SCREEN
   ========================================================================= */
function ScreenProgress(){
  const g = S.gami;
  const xpPct = Math.min(100, Math.round((g.xp/xpForLevel(g.level))*100));
  const bySubject = {};
  S.testHistory.forEach(t=>{
    const c = S.chapters.find(ch=>ch.id===t.chapterId);
    const subj = c ? c.subject : 'General';
    bySubject[subj] = bySubject[subj] || {total:0, count:0};
    bySubject[subj].total += t.score; bySubject[subj].count++;
  });
  const subjectAverages = Object.entries(bySubject).map(([k,v])=>({subject:k, avg:v.total/v.count})).sort((a,b)=>a.avg-b.avg);
  const weakTopics = subjectAverages.filter(s=>s.avg<50);
  const debateWins = S.debateHistory.filter(d=>d.result==='win').length;
  const debateTotal = S.debateHistory.length;

  return `<div class="topbar"><h2>Progress</h2></div>
  <div class="scr" style="padding-top:6px;">
    <div class="profile-card" style="margin-bottom:18px;">
      <div class="row between" style="position:relative; z-index:1;">
        <div><div style="font-size:12px; opacity:.85;">Level</div><div style="font-size:26px; font-weight:800;">⭐ ${g.level}</div></div>
        <div style="text-align:right;"><div style="font-size:12px; opacity:.85;">Total YUH Earned</div><div style="font-size:20px; font-weight:800;">🪙 ${g.totalEarned}</div></div>
      </div>
      <div class="xp-track"><div class="xp-fill" style="width:${xpPct}%"></div></div>
      <div style="font-size:11px; opacity:.85; margin-top:5px;">${g.xp} / ${xpForLevel(g.level)} XP</div>
    </div>

    <div class="section-title">Study Streak</div>
    <div class="card row between"><div><div style="font-weight:700; font-size:20px;">🔥 ${g.streak} days</div><div class="muted" style="font-size:12px;">Keep logging in daily!</div></div></div>

    <div class="section-title">Test Performance by Subject</div>
    ${subjectAverages.length===0 ? `<div class="card" style="text-align:center; color:var(--grey-500); font-size:13px;">Take some tests to see analytics here</div>` :
      `<div class="card">${subjectAverages.map(s=>`<div class="bar-row"><div class="bl">${esc(s.subject)}</div><div class="bt"><div class="progress-fill" style="width:${s.avg}%; background:${s.avg<50?'linear-gradient(90deg,#f0a3ad,var(--red))':'linear-gradient(90deg,var(--purple-400),var(--purple-600))'};"></div></div><div class="bv">${Math.round(s.avg)}%</div></div>`).join('')}</div>`
    }

    <div class="section-title">🎯 Weak Topic Detection (AI)</div>
    ${weakTopics.length===0 ? `<div class="card" style="text-align:center; color:var(--grey-500); font-size:13px;">No weak topics detected yet — nice work!</div>` :
      weakTopics.map(w=>`<div class="task-item"><div class="task-check" style="border-color:var(--red); color:var(--red);">!</div><div style="flex:1;"><div style="font-weight:700; font-size:13px;">${esc(w.subject)}</div><div class="muted" style="font-size:11.5px;">Average ${Math.round(w.avg)}% — revise with AI Doubt Solver</div></div></div>`).join('')
    }

    <div class="section-title">⚖️ AI Debate Record</div>
    <div class="card row between"><div><div style="font-weight:700; font-size:15px;">${debateWins} / ${debateTotal} won</div><div class="muted" style="font-size:12px;">${debateTotal===0?'No debates yet':((debateWins/debateTotal*100).toFixed(0))+'% win rate'}</div></div><div style="font-size:24px;">🏆</div></div>

    <div class="section-title">🏅 All Achievements</div>
    <div class="feat-grid">
      ${ACHIEVEMENT_DEFS.map(a=>{ const got = S.achievementsUnlocked.includes(a.id); return `<div class="feat-card" style="${got?'':'opacity:.4;'}"><div class="fi" style="background:var(--purple-100); color:var(--purple-700);">${a.icon}</div><div class="ft">${a.title}</div><div class="fs">${a.desc}</div></div>`; }).join('')}
    </div>
  </div>`;
}
</script>

    </div>

    <div class="section-title">Stats</div>
    <div class="quick-grid">

      <div class="quick-card"><div class="qi">📚</div><div class="qt">${S.chapters.length}</div><div class="qs">Chapters Added</div></div>
      <div class="quick-card"><div class="qi">🧪</div><div class="qt">${S.testHistory.length}</div><div class="qs">Tests Attempted</div></div>
      <div class="quick-card"><div class="qi">⚖️</div><div class="qt">${S.debateHistory.length}</div><div class="qs">Debates Fought</div></div>
    </div>

    <div class="section-title">Danger Zone</div>
    <button class="btn btn-danger btn-block" onclick="resetAllData()">Reset All My Data</button>
    <p class="muted" style="text-align:center; font-size:11px; margin-top:20px;">Pinnacle AI Study · v1.0 · Your data stays yours</p>
  </div>`;
}
async function changeLanguage(l){ S.profile.language = l; await persistProfile(); render(); }
async function saveGeminiKey(){
  const val = document.getElementById('geminiKeyInput').value.trim();
  S.profile.geminiKey = val;
  await persistProfile();
  alert(val ? 'Backup AI key saved ✅' : 'Backup key cleared.');
}
async function resetAllData(){
  if(!confirm('Pakka? Yeh sab data permanently delete kar dega — chapters, notes, tests, YUH, sab kuch.')) return;
  for(const k of Object.values(STORE_KEYS)){ try{ localStorage.removeItem(k); }catch(e){} }
  location.reload();
}
</script>

<script>
/* =========================================================================
   APP BOOT
   ========================================================================= */
async function bootApp(){
  const splashStart = Date.now();
  await loadAll();
  if(S.profile && S.profile.name){
    await touchStreak();
    go('dashboard');
  } else {
    go('landing');
  }
  const elapsed = Date.now() - splashStart;
  setTimeout(()=>{ const sp = document.getElementById('bootSplash'); if(sp) sp.classList.add('hide'); }, Math.max(0, 500 - elapsed));
}
bootApp();
</script>
