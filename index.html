<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pinnacle — AI Smart Study Super App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ===================== DESIGN TOKENS ===================== */
:root{
  --white:#ffffff;
  --bg:#f7f6fb;
  --bg-2:#f1eef9;
  --grey-50:#f8f8fa;
  --grey-100:#eeeef2;
  --grey-200:#e3e2ea;
  --grey-300:#cdccd6;
  --grey-400:#a6a4b4;
  --grey-500:#807e92;
  --grey-600:#5e5c6e;
  --grey-700:#403e4d;
  --grey-900:#211f2b;
  --purple-50:#f5f2fd;
  --purple-100:#ebe4fb;
  --purple-200:#d9cdf7;
  --purple-300:#bfaaf0;
  --purple-400:#a382e8;
  --purple-500:#8b5fdf;
  --purple-600:#7445cf;
  --purple-700:#5d33ab;
  --gold:#e8b339;
  --gold-deep:#c49120;
  --green:#3fb87f;
  --red:#e0566b;
  --blue:#5b8def;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:24px;
  --radius-xl:32px;
  --shadow-sm: 0 2px 8px rgba(93,51,171,0.06);
  --shadow-md: 0 8px 24px rgba(93,51,171,0.10);
  --shadow-lg: 0 16px 40px rgba(93,51,171,0.14);
  --font-display:'Outfit', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
[data-theme="dark"]{
  --white:#1c1a24;
  --bg:#14131a;
  --bg-2:#1a1822;
  --grey-50:#211f2b;
  --grey-100:#272534;
  --grey-200:#322f40;
  --grey-300:#454258;
  --grey-400:#615d75;
  --grey-500:#8a86a0;
  --grey-600:#a9a5bd;
  --grey-700:#cac6dc;
  --grey-900:#f1eef9;
  --purple-50:#241f38;
  --purple-100:#2c2645;
  --purple-200:#3a3158;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.35);
  --shadow-lg: 0 16px 40px rgba(0,0,0,0.45);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(900px 500px at 90% -10%, var(--purple-100), transparent 60%),
    radial-gradient(700px 500px at -10% 10%, var(--bg-2), transparent 55%),
    var(--bg);
  color:var(--grey-900);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
#app{min-height:100vh; max-width:560px; margin:0 auto; position:relative; padding-bottom:86px;}
::selection{background:var(--purple-200);}
a{color:inherit;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input,textarea,select{font-family:inherit; font-size:15px;}
h1,h2,h3,h4{font-family:var(--font-display); color:var(--grey-900); letter-spacing:-0.01em;}
.scr{ padding:20px 18px 28px; animation:fadeUp .38s ease both; }
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.muted{color:var(--grey-500);}
.row{display:flex; align-items:center;}
.row.between{justify-content:space-between;}
.row.gap-8{gap:8px;}
.row.gap-12{gap:12px;}
.col{display:flex; flex-direction:column;}
.spacer{flex:1;}

/* ===================== BUTTONS ===================== */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 22px; border-radius:var(--radius-m); font-weight:600; font-size:15px;
  transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
}
.btn:active{transform:scale(.96);}
.btn-primary{
  background:linear-gradient(135deg, var(--purple-500), var(--purple-700));
  color:#fff; box-shadow:0 8px 20px rgba(116,69,207,0.35);
}
.btn-primary:hover{box-shadow:0 10px 26px rgba(116,69,207,0.45);}
.btn-secondary{ background:var(--white); color:var(--purple-700); border:1.5px solid var(--purple-200); box-shadow:var(--shadow-sm);}
.btn-ghost{ background:var(--purple-50); color:var(--purple-700); }
.btn-block{width:100%;}
.btn-sm{padding:9px 14px; font-size:13px; border-radius:var(--radius-s);}
.btn:disabled{opacity:.45; pointer-events:none;}
.btn-danger{background:linear-gradient(135deg,#ef7c8e,var(--red)); color:#fff;}
.icon-btn{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--white); box-shadow:var(--shadow-sm); font-size:17px;}

/* ===================== CARDS ===================== */
.card{
  background:var(--white); border-radius:var(--radius-l); padding:18px;
  box-shadow:var(--shadow-sm); border:1px solid var(--grey-100);
}
.card.glass{
  background:linear-gradient(155deg, rgba(255,255,255,0.85), rgba(245,242,253,0.7));
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.6);
}
.card.tap{transition:transform .15s ease, box-shadow .15s ease;}
.card.tap:active{transform:scale(.98);}
.section-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--grey-500); margin:22px 2px 10px;}

/* ===================== FORM ELEMENTS ===================== */
.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; font-weight:600; color:var(--grey-600); margin-bottom:7px;}
.field input[type=text], .field input[type=number], .field textarea, .field select{
  width:100%; padding:13px 14px; border-radius:var(--radius-s); border:1.5px solid var(--grey-200);
  background:var(--grey-50); color:var(--grey-900); outline:none; transition:border-color .15s, background .15s;
}
.field input:focus, .field textarea:focus, .field select:focus{border-color:var(--purple-400); background:var(--white);}
.field textarea{resize:vertical; min-height:80px;}
.chip-group{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  padding:9px 14px; border-radius:999px; border:1.5px solid var(--grey-200); background:var(--white);
  font-size:13px; font-weight:600; color:var(--grey-600); transition:all .15s ease;
}
.chip.active{background:linear-gradient(135deg,var(--purple-500),var(--purple-700)); color:#fff; border-color:transparent; box-shadow:0 4px 14px rgba(116,69,207,.3);}
.chip-cat{font-size:11px; font-weight:700; text-transform:uppercase; color:var(--grey-400); letter-spacing:.05em; margin:14px 0 8px;}
.progress-track{height:8px; background:var(--grey-100); border-radius:999px; overflow:hidden;}
.progress-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--purple-400),var(--purple-600)); transition:width .5s ease;}

/* ===================== LANDING ===================== */
.landing{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 28px;}
.landing-logo{
  width:84px; height:84px; border-radius:26px; display:flex; align-items:center; justify-content:center;
  font-size:40px; background:linear-gradient(145deg,var(--purple-400),var(--purple-700)); box-shadow:0 14px 34px rgba(116,69,207,.4);
  margin-bottom:22px; animation:floaty 4s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-8px) rotate(-3deg);}}
.landing h1{font-size:34px; font-weight:800; line-height:1.15; margin-bottom:10px;}
.landing h1 span{color:var(--purple-600);}
.landing p.tag{color:var(--grey-500); font-size:15.5px; margin-bottom:34px; max-width:320px;}
.landing-pills{display:flex; gap:10px; margin-top:30px; flex-wrap:wrap; justify-content:center;}
.landing-pill{font-size:12px; font-weight:600; padding:7px 13px; border-radius:999px; background:var(--white); color:var(--grey-600); box-shadow:var(--shadow-sm);}

/* ===================== TOP BAR ===================== */
.topbar{display:flex; align-items:center; justify-content:space-between; padding:18px 18px 6px;}
.topbar h2{font-size:20px; font-weight:800;}
.back-btn{font-size:20px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--grey-100);}

/* ===================== STEP DOTS ===================== */
.step-dots{display:flex; gap:6px; justify-content:center; margin:6px 0 22px;}
.step-dot{width:26px; height:5px; border-radius:4px; background:var(--grey-200);}
.step-dot.active{background:var(--purple-500);}

/* ===================== DASHBOARD ===================== */
.profile-card{
  background:linear-gradient(150deg, var(--purple-600), var(--purple-700) 60%, #4a2a8f);
  border-radius:var(--radius-xl); padding:22px; color:#fff; position:relative; overflow:hidden; box-shadow:var(--shadow-lg);
}
.profile-card::before{content:''; position:absolute; width:220px; height:220px; background:radial-gradient(circle, rgba(255,255,255,.18), transparent 70%); top:-90px; right:-60px;}
.avatar{
  width:54px; height:54px; border-radius:18px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:20px; border:1.5px solid rgba(255,255,255,.35);
}
.level-badge{font-size:11px; font-weight:700; background:rgba(255,255,255,.2); padding:3px 9px; border-radius:999px; margin-top:4px; display:inline-block;}
.xp-track{height:9px; background:rgba(255,255,255,.22); border-radius:999px; margin-top:14px; overflow:hidden;}
.xp-fill{height:100%; background:linear-gradient(90deg,var(--gold),#fde68a); border-radius:999px; transition:width .6s ease;}
.stat-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:18px;}
.stat-mini{background:rgba(255,255,255,.14); border-radius:14px; padding:10px; text-align:center;}
.stat-mini .v{font-size:17px; font-weight:800;}
.stat-mini .l{font-size:10.5px; opacity:.85; margin-top:2px;}

.ring-wrap{position:relative; width:74px; height:74px;}
.quick-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.quick-card{padding:16px; border-radius:var(--radius-m); background:var(--white); box-shadow:var(--shadow-sm); border:1px solid var(--grey-100); transition:transform .15s;}
.quick-card:active{transform:scale(.96);}
.quick-card .qi{font-size:22px;}
.quick-card .qt{font-weight:700; font-size:14px; margin-top:8px;}
.quick-card .qs{font-size:11.5px; color:var(--grey-500); margin-top:2px;}

.task-item{display:flex; align-items:center; gap:12px; padding:12px; border-radius:14px; background:var(--white); border:1px solid var(--grey-100); margin-bottom:8px;}
.task-check{width:22px; height:22px; border-radius:7px; border:2px solid var(--grey-300); flex:none; display:flex; align-items:center; justify-content:center; font-size:13px;}
.task-check.done{background:var(--green); border-color:var(--green); color:#fff;}

.achv{display:flex; align-items:center; gap:10px; background:var(--white); padding:10px 12px; border-radius:14px; border:1px solid var(--grey-100); margin-bottom:8px;}
.achv .ai{width:36px; height:36px; border-radius:10px; background:var(--purple-50); display:flex; align-items:center; justify-content:center; font-size:17px;}

/* ===================== BOTTOM NAV ===================== */
.bottomnav{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:560px;
  background:rgba(255,255,255,.88); backdrop-filter:blur(16px); border-top:1px solid var(--grey-100);
  display:flex; justify-content:space-around; padding:9px 4px 12px; z-index:50;
}
[data-theme="dark"] .bottomnav{background:rgba(28,26,36,.9);}
.navbtn{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:600; color:var(--grey-400); padding:4px 10px; border-radius:12px; transition:color .15s;}
.navbtn .ni{font-size:19px;}
.navbtn.active{color:var(--purple-600);}

/* ===================== STUDY / GRID ===================== */
.feat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
.feat-card{
  background:var(--white); border-radius:var(--radius-m); padding:16px; box-shadow:var(--shadow-sm); border:1px solid var(--grey-100);
  display:flex; flex-direction:column; gap:8px; min-height:108px; position:relative;
}
.feat-card .fi{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:18px;}
.feat-card .ft{font-weight:700; font-size:13.5px;}
.feat-card .fs{font-size:11px; color:var(--grey-500);}
.feat-badge{position:absolute; top:10px; right:10px; font-size:9px; font-weight:700; background:var(--green); color:#fff; padding:2px 7px; border-radius:999px;}

.chapter-pill{display:flex; align-items:center; gap:10px; background:var(--white); border:1.5px solid var(--grey-200); padding:11px 13px; border-radius:14px; margin-bottom:8px;}
.chapter-pill.sel{border-color:var(--purple-400); background:var(--purple-50);}

/* ===================== LOADING / AI ===================== */
.ai-loading{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:50px 20px; gap:14px;}
.spinner{
  width:46px; height:46px; border-radius:50%; position:relative;
  background:conic-gradient(from 0deg, var(--purple-200), var(--purple-500) 60%, var(--purple-200));
  animation:spin .9s linear infinite;
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
}
@keyframes spin{to{transform:rotate(360deg);}}
.dot-loader{display:flex; gap:5px;}
.dot-loader span{width:7px; height:7px; border-radius:50%; background:var(--purple-400); animation:dotBounce 1.1s ease-in-out infinite;}
.dot-loader span:nth-child(2){animation-delay:.15s;}
.dot-loader span:nth-child(3){animation-delay:.3s;}
@keyframes dotBounce{0%,80%,100%{transform:translateY(0); opacity:.5;} 40%{transform:translateY(-6px); opacity:1;}}

/* ===================== BOOT SPLASH ===================== */
#bootSplash{
  position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(900px 500px at 50% 0%, var(--purple-100), var(--bg) 60%);
  transition:opacity .5s ease, visibility .5s ease;
}
#bootSplash.hide{opacity:0; visibility:hidden; pointer-events:none;}
.splash-logo{
  width:78px; height:78px; border-radius:24px; display:flex; align-items:center; justify-content:center; font-size:36px;
  background:linear-gradient(145deg,var(--purple-400),var(--purple-700)); box-shadow:0 14px 34px rgba(116,69,207,.4);
  animation:splashPulse 1.4s ease-in-out infinite;
}
@keyframes splashPulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.08);}}
.splash-name{font-family:var(--font-display); font-weight:800; font-size:18px; margin-top:16px; color:var(--grey-900); letter-spacing:.01em;}

/* ===================== LANDING AMBIENT BLOBS ===================== */
.landing{position:relative; overflow:hidden;}
.bg-blob{position:absolute; border-radius:50%; filter:blur(50px); opacity:.45; z-index:0; animation:blobDrift 9s ease-in-out infinite;}
.bg-blob.b1{width:200px; height:200px; background:var(--purple-300); top:6%; left:-60px; animation-duration:11s;}
.bg-blob.b2{width:160px; height:160px; background:#fde68a; bottom:12%; right:-50px; animation-duration:8s; animation-delay:1s;}
.bg-blob.b3{width:130px; height:130px; background:#a7d8ff; top:55%; left:70%; animation-duration:10s; animation-delay:2s;}
@keyframes blobDrift{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(14px,-18px) scale(1.12);}}
.landing > *{position:relative; z-index:1;}

/* ===================== PROGRESS RING WIDGET ===================== */
.ring-card{display:flex; align-items:center; gap:16px;}
.ring-svg{transform:rotate(-90deg);}
.ring-svg circle{transition:stroke-dashoffset .8s cubic-bezier(.4,.2,.2,1);}
.ring-center-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; font-family:var(--font-mono); color:var(--purple-700);}

/* ===================== NAV ACTIVE DOT ===================== */
.navbtn{position:relative;}
.navbtn .ni{transition:transform .25s cubic-bezier(.34,1.5,.64,1);}
.navbtn.active .ni{transform:translateY(-2px) scale(1.12);}
.nav-dot{width:4px; height:4px; border-radius:50%; background:var(--purple-600); margin-top:1px; opacity:0; transform:scale(0); transition:all .25s ease;}
.navbtn.active .nav-dot{opacity:1; transform:scale(1);}
.ai-bubble{background:var(--purple-50); border-radius:16px; padding:14px 16px; font-size:14.5px; line-height:1.55; color:var(--grey-700); white-space:pre-wrap;}
.content-block{margin-bottom:14px;}
.tag-pill{font-size:10.5px; font-weight:700; background:var(--purple-100); color:var(--purple-700); padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em;}

/* ===================== FLASHCARD ===================== */
.flash-stage{height:230px; perspective:1200px; margin:10px 0;}
.flash-card{width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.4,.2,.2,1); cursor:pointer;}
.flash-card.flipped{transform:rotateY(180deg);}
.flash-face{position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius-l); display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; font-weight:600; font-size:17px; box-shadow:var(--shadow-md);}
.flash-front{background:linear-gradient(150deg,var(--white),var(--purple-50)); color:var(--grey-900); border:1.5px solid var(--purple-100);}
.flash-back{background:linear-gradient(150deg,var(--purple-600),var(--purple-700)); color:#fff; transform:rotateY(180deg);}

/* ===================== TEST ===================== */
.mcq-opt{display:flex; align-items:center; gap:10px; padding:13px 14px; border-radius:14px; border:1.5px solid var(--grey-200); background:var(--white); margin-bottom:9px; font-size:14.5px; transition:all .15s;}
.mcq-opt.sel{border-color:var(--purple-400); background:var(--purple-50);}
.mcq-opt.correct{border-color:var(--green); background:#eafbf2;}
.mcq-opt.wrong{border-color:var(--red); background:#fdecef;}
.mcq-letter{width:26px; height:26px; border-radius:8px; background:var(--grey-100); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:none;}

/* ===================== ORAL TEST / DEBATE COURTROOM ===================== */
.courtroom{
  border-radius:var(--radius-l); overflow:hidden; position:relative; padding:26px 18px 22px;
  background:
    radial-gradient(500px 240px at 50% -30px, rgba(196,145,32,.18), transparent 70%),
    linear-gradient(180deg, #2b2440 0%, #1d1830 55%, #14101f 100%);
  color:#fff; box-shadow:var(--shadow-lg);
}
.court-bench{display:flex; flex-direction:column; align-items:center; margin-bottom:18px;}
.judge-avatar{width:64px; height:64px; border-radius:50%; background:linear-gradient(145deg,#e8d9a0,#c4912c); display:flex; align-items:center; justify-content:center; font-size:30px; box-shadow:0 0 0 4px rgba(232,179,57,.25), 0 10px 22px rgba(0,0,0,.4);}
.judge-label{font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--gold); margin-top:8px; text-transform:uppercase;}
.gavel{font-size:13px; margin-top:3px; opacity:.8;}
.vs-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:6px;}
.duel-side{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;}
.duel-avatar{width:58px; height:58px; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; box-shadow:0 8px 18px rgba(0,0,0,.35);}
.duel-avatar.user{background:linear-gradient(150deg,var(--purple-400),var(--purple-600));}
.duel-avatar.ai{background:linear-gradient(150deg,#3a3550,#221d35); border:1.5px solid rgba(255,255,255,.15);}
.duel-name{font-size:12.5px; font-weight:700;}
.duel-score{font-size:19px; font-weight:800; font-family:var(--font-mono);}
.vs-mid{font-family:var(--font-display); font-weight:800; color:var(--gold); font-size:15px; flex:none;}
.court-question{background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:16px; margin-top:18px; font-size:15px; line-height:1.5;}
.court-qnum{font-size:11px; color:var(--gold); font-weight:700; margin-bottom:6px; letter-spacing:.05em;}
.court-answerbox textarea{background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.18); color:#fff; border-radius:14px; padding:13px; width:100%; min-height:80px;}
.court-answerbox textarea::placeholder{color:rgba(255,255,255,.4);}
.verdict-row{display:flex; gap:10px; margin-top:14px;}
.verdict-box{flex:1; background:rgba(255,255,255,.06); border-radius:12px; padding:10px; text-align:center;}
.verdict-box .vv{font-size:20px; font-weight:800;}
.verdict-box.win{background:rgba(63,184,127,.18); border:1px solid rgba(63,184,127,.4);}
.verdict-box.lose{background:rgba(224,86,107,.14); border:1px solid rgba(224,86,107,.35);}
.mode-card{border-radius:var(--radius-m); padding:16px; border:1.5px solid var(--grey-200); background:var(--white); margin-bottom:10px; display:flex; align-items:center; gap:14px;}
.mode-card.sel{border-color:var(--purple-400); background:var(--purple-50); box-shadow:0 4px 14px rgba(139,95,223,.15);}
.mode-dot{width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; color:#fff; flex:none;}

/* ===================== PLANNER ===================== */
.day-card{background:var(--white); border-radius:16px; border:1px solid var(--grey-100); padding:14px; margin-bottom:10px; box-shadow:var(--shadow-sm);}
.day-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
.day-head .dn{font-weight:800; font-size:14.5px;}
.day-head .dd{font-size:11.5px; color:var(--grey-500);}
.plan-task{display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:7px 0; border-top:1px dashed var(--grey-200);}
.plan-task:first-of-type{border-top:none;}

/* ===================== PROGRESS ===================== */
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.bar-row .bl{width:84px; font-size:12px; font-weight:600; color:var(--grey-600); flex:none;}
.bar-row .bt{flex:1; height:10px; background:var(--grey-100); border-radius:999px; overflow:hidden;}
.bar-row .bv{font-size:12px; font-weight:700; width:34px; text-align:right; flex:none;}

/* ===================== TOASTS / REWARD ===================== */
#toastLayer{position:fixed; top:0; left:50%; transform:translateX(-50%); width:100%; max-width:560px; z-index:999; pointer-events:none;}
.reward-pop{
  position:absolute; left:50%; top:90px; transform:translate(-50%,0); background:var(--white); border-radius:20px;
  padding:18px 26px; box-shadow:0 20px 50px rgba(0,0,0,.25); display:flex; flex-direction:column; align-items:center; gap:6px;
  animation:rewardIn .45s cubic-bezier(.34,1.4,.64,1) forwards, rewardOut .4s ease forwards 1.9s;
  border:2px solid var(--gold);
}
@keyframes rewardIn{from{opacity:0; transform:translate(-50%,-20px) scale(.7);} to{opacity:1; transform:translate(-50%,0) scale(1);}}
@keyframes rewardOut{from{opacity:1;} to{opacity:0; transform:translate(-50%,-12px) scale(.9);}}
.reward-pop .rcoin{font-size:34px;}
.reward-pop .ramt{font-size:21px; font-weight:800; color:var(--gold-deep); font-family:var(--font-mono);}
.reward-pop .rlbl{font-size:12px; color:var(--grey-500); font-weight:600;}
.float-yuh{position:absolute; font-weight:800; font-size:15px; color:var(--gold-deep); animation:floatUp 1.1s ease forwards; pointer-events:none; z-index:998; font-family:var(--font-mono);}
@keyframes floatUp{0%{opacity:0; transform:translateY(0) scale(.7);} 15%{opacity:1; transform:translateY(-6px) scale(1.1);} 100%{opacity:0; transform:translateY(-60px) scale(1);}}
.confetti-piece{position:fixed; top:-10px; width:8px; height:14px; z-index:997; pointer-events:none; animation:confettiFall linear forwards;}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(540deg); opacity:.2;}}
.levelup-overlay{position:fixed; inset:0; background:rgba(20,16,30,.78); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:996; animation:fadeUp .3s ease;}
.levelup-card{background:linear-gradient(160deg,var(--purple-500),var(--purple-700)); border-radius:28px; padding:34px 30px; text-align:center; color:#fff; max-width:300px; box-shadow:0 30px 60px rgba(0,0,0,.5);}

/* ===================== MISC ===================== */
.empty-state{text-align:center; padding:50px 20px; color:var(--grey-500);}
.empty-state .ei{font-size:40px; margin-bottom:10px;}
.streak-flame{font-size:15px;}
.modal-bg{position:fixed; inset:0; background:rgba(20,16,30,.5); z-index:200; display:flex; align-items:flex-end; backdrop-filter:blur(2px);}
.modal-sheet{background:var(--white); width:100%; max-width:560px; margin:0 auto; border-radius:24px 24px 0 0; padding:22px 18px 30px; max-height:82vh; overflow-y:auto; animation:sheetUp .3s ease;}
@keyframes sheetUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:38px; height:4px; background:var(--grey-200); border-radius:99px; margin:0 auto 16px;}
.toggle-row{display:flex; background:var(--grey-100); border-radius:12px; padding:3px; margin-bottom:14px;}
.toggle-row button{flex:1; padding:9px; border-radius:10px; font-weight:600; font-size:13px; color:var(--grey-500);}
.toggle-row button.active{background:var(--white); color:var(--purple-700); box-shadow:var(--shadow-sm);}
.mic-btn{width:64px; height:64px; border-radius:50%; background:linear-gradient(150deg,var(--purple-500),var(--purple-700)); display:flex; align-items:center; justify-content:center; font-size:26px; color:#fff; box-shadow:0 10px 26px rgba(116,69,207,.4); margin:0 auto;}
.mic-btn.listening{animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(116,69,207,.5);} 50%{box-shadow:0 0 0 14px rgba(116,69,207,0);}}
.skeleton{background:linear-gradient(90deg,var(--grey-100) 25%,var(--grey-200) 37%,var(--grey-100) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:8px;}
@keyframes shimmer{0%{background-position:100% 50%;} 100%{background-position:0 50%;}}
.theme-toggle{width:42px; height:24px; border-radius:99px; background:var(--grey-200); position:relative; flex:none;}
.theme-toggle .dot{width:18px; height:18px; border-radius:50%; background:var(--white); position:absolute; top:3px; left:3px; transition:left .2s ease; box-shadow:var(--shadow-sm);}
[data-theme="dark"] .theme-toggle{background:var(--purple-500);}
[data-theme="dark"] .theme-toggle .dot{left:21px;}
</style>

<body data-theme="light">
<div id="bootSplash"><div class="splash-logo">🎓</div><div class="splash-name">Pinnacle AI Study</div><div class="dot-loader" style="margin-top:14px;"><span></span><span></span><span></span></div></div>
<div id="app"></div>
<div id="toastLayer"></div>
<script>
/* =========================================================================
   PINNACLE — AI SMART STUDY SUPER APP
   Core engine: state, storage, gamification, router, toasts
   ========================================================================= */

/* ---------- STATIC CONFIG (app content, not user data) ---------- */
const CLASS_LIST = [
  "Nursery","LKG","UKG","Class 1","Class 2","Class 3","Class 4","Class 5",
  "Class 6","Class 7","Class 8","Class 9","Class 10","Class 11","Class 12",
  "College / University","JEE Aspirant","NEET Aspirant","UPSC Aspirant","Other Competitive Exam"
];
const BOARD_LIST = ["CBSE","ICSE","State Board","International (IB/IGCSE)","University","Other"];
const LANGUAGE_LIST = ["English","Hindi","Hinglish","Regional Language"];

const SUBJECT_CATALOG = {
  "School Core": ["Mathematics","Physics","Chemistry","Biology","Science","English","Hindi","Social Science","History","Geography","Civics","Computer Science","General Knowledge","Environmental Science","Moral Science","Physical Education","Arts","Music","Sanskrit","French","German"],
  "Competitive Exams": ["JEE Physics","JEE Chemistry","JEE Maths","NEET Biology","NEET Physics","NEET Chemistry","NDA","SSC","Banking","UPSC GS","Reasoning","Quantitative Aptitude","Current Affairs"],
  "Commerce": ["Accountancy","Business Studies","Economics","Taxation","Marketing","Entrepreneurship","Auditing"],
  "Humanities": ["Psychology","Sociology","Political Science","Philosophy","History (Advanced)","Anthropology"],
  "Tech": ["Programming","DSA","Web Development","App Development","AI / ML Basics","Cyber Security","Databases"],
  "Advanced / University": ["Law","Medicine","Architecture","Mechanical Engineering","Civil Engineering","Electrical Engineering","Computer Engineering","Research Methodology"]
};

const ACHIEVEMENT_DEFS = [
  {id:"first_chapter", icon:"📘", title:"First Chapter", desc:"Added your first chapter", check:s=>s.chapters.length>=1},
  {id:"first_note", icon:"📝", title:"Note Taker", desc:"Generated your first notes", check:s=>countContent(s,'notes')>=1},
  {id:"first_test", icon:"🧪", title:"Test Rookie", desc:"Completed your first test", check:s=>s.testHistory.length>=1},
  {id:"streak3", icon:"🔥", title:"3-Day Streak", desc:"Studied 3 days in a row", check:s=>s.gami.streak>=3},
  {id:"streak7", icon:"🔥", title:"Week Warrior", desc:"Studied 7 days in a row", check:s=>s.gami.streak>=7},
  {id:"level5", icon:"🏆", title:"Level 5 Scholar", desc:"Reached Level 5", check:s=>s.gami.level>=5},
  {id:"debate_win", icon:"⚖️", title:"Courtroom Champion", desc:"Won your first AI Debate", check:s=>s.debateHistory.some(d=>d.result==='win')},
  {id:"yuh500", icon:"🪙", title:"YUH Collector", desc:"Earned 500+ YUH total", check:s=>s.gami.totalEarned>=500},
  {id:"planner1", icon:"📅", title:"Planner Pro", desc:"Created a study plan", check:s=>s.plans.length>=1},
];

const DEBATE_MODES = [
  {id:"easy", label:"Easy", color:"#3fb87f", reward:50, q:20, desc:"Basic concept questions"},
  {id:"medium", label:"Medium", color:"#5b8def", reward:100, q:20, desc:"Applied understanding"},
  {id:"hard", label:"Hard", color:"#e8b339", reward:150, q:20, desc:"Tricky, multi-step reasoning"},
  {id:"veryhard", label:"Very Hard", color:"#e0566b", reward:200, q:20, desc:"Expert-level, competitive intensity"},
];

/* ---------- GLOBAL STATE ---------- */
let S = {
  booted:false,
  screen:"landing",
  profile:null,
  chapters:[],
  activeChapterId:null,
  studyContent:{},
  gami:{ yuh:0, xp:0, level:1, streak:0, lastLogin:null, totalEarned:0 },
  achievementsUnlocked:[],
  testHistory:[],
  generatedTests:{},
  debateHistory:[],
  plans:[],
  todayTasks:[],
  _tmp:{}
};

function countContent(s, key){
  let c=0;
  Object.values(s.studyContent||{}).forEach(v=>{ if(v && v[key] && (Array.isArray(v[key])? v[key].length: true)) c++; });
  return c;
}

/* ---------- STORAGE LAYER (per-user, private — plain browser localStorage so it works on any host) ---------- */
const STORE_KEYS = {
  profile:"pinnacle:profile",
  chapters:"pinnacle:chapters",
  gami:"pinnacle:gami",
  content:"pinnacle:study-content",
  tests:"pinnacle:test-data",
  debate:"pinnacle:debate-data",
  plans:"pinnacle:plan-data",
  achievements:"pinnacle:achievements"
};

async function storeGet(key){
  try{
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
async function storeSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ console.error("storage set failed", e); }
}

async function loadAll(){
  const [profile, chapters, gami, content, tests, debate, plans, ach] = await Promise.all([
    storeGet(STORE_KEYS.profile), storeGet(STORE_KEYS.chapters), storeGet(STORE_KEYS.gami),
    storeGet(STORE_KEYS.content), storeGet(STORE_KEYS.tests), storeGet(STORE_KEYS.debate),
    storeGet(STORE_KEYS.plans), storeGet(STORE_KEYS.achievements)
  ]);
  S.profile = profile;
  S.chapters = chapters || [];
  S.gami = gami || { yuh:0, xp:0, level:1, streak:0, lastLogin:null, totalEarned:0 };
  S.studyContent = content || {};
  S.testHistory = (tests && tests.history) || [];
  S.generatedTests = (tests && tests.sets) || {};
  S.debateHistory = (debate && debate.history) || [];
  S.plans = plans || [];
  S.achievementsUnlocked = ach || [];
}
function persistProfile(){ return storeSet(STORE_KEYS.profile, S.profile); }
function persistChapters(){ return storeSet(STORE_KEYS.chapters, S.chapters); }
function persistGami(){ return storeSet(STORE_KEYS.gami, S.gami); }
function persistContent(){ return storeSet(STORE_KEYS.content, S.studyContent); }
function persistTests(){ return storeSet(STORE_KEYS.tests, {history:S.testHistory, sets:S.generatedTests}); }
function persistDebate(){ return storeSet(STORE_KEYS.debate, {history:S.debateHistory}); }
function persistPlans(){ return storeSet(STORE_KEYS.plans, S.plans); }
function persistAchievements(){ return storeSet(STORE_KEYS.achievements, S.achievementsUnlocked); }

/* ---------- THEME ---------- */
function applyTheme(){
  document.body.setAttribute('data-theme', (S.profile && S.profile.theme) || 'light');
}
function toggleTheme(){
  if(!S.profile) return;
  S.profile.theme = S.profile.theme === 'dark' ? 'light' : 'dark';
  applyTheme(); persistProfile(); render();
}

/* ---------- GAMIFICATION ENGINE ---------- */
function xpForLevel(level){ return level*1000; }

async function grantYuh(amount, label, opts){
  opts = opts || {};
  const before = S.gami.level;
  S.gami.yuh = Math.max(0, S.gami.yuh + amount);
  if(amount>0){ S.gami.xp += amount; S.gami.totalEarned += amount; }
  while(S.gami.xp >= xpForLevel(S.gami.level)){
    S.gami.xp -= xpForLevel(S.gami.level);
    S.gami.level += 1;
  }
  await persistGami();
  if(!opts.silent) showRewardPop(amount, label);
  if(S.gami.level > before && !opts.silent) showLevelUp(S.gami.level);
  await checkAchievements();
  return S.gami;
}

async function touchStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(S.gami.lastLogin === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.toISOString().slice(0,10);
  if(S.gami.lastLogin === yesterday){ S.gami.streak += 1; } else { S.gami.streak = 1; }
  S.gami.lastLogin = today;
  await persistGami();
  await grantYuh(5, "Daily Login", {silent:false});
}

async function checkAchievements(){
  let unlocked = false;
  for(const a of ACHIEVEMENT_DEFS){
    if(!S.achievementsUnlocked.includes(a.id) && a.check(S)){
      S.achievementsUnlocked.push(a.id);
      unlocked = true;
      showAchievementToast(a);
    }
  }
  if(unlocked) await persistAchievements();
}

/* ---------- TOASTS / REWARD ANIMATIONS ---------- */
function showRewardPop(amount, label){
  const layer = document.getElementById('toastLayer');
  const pop = document.createElement('div');
  pop.className = 'reward-pop';
  const sign = amount>=0 ? '+' : '';
  pop.innerHTML = `<div class="rcoin">${amount>=0?'🪙':'💔'}</div><div class="ramt" style="color:${amount>=0?'var(--gold-deep)':'var(--red)'}">${sign}${amount} YUH</div><div class="rlbl">${label}</div>`;
  layer.appendChild(pop);
  if(amount>0) burstConfetti();
  try{ if(navigator.vibrate) navigator.vibrate(amount>=0?[20,30,20]:[40]); }catch(e){}
  playChime(amount>=0);
  setTimeout(()=>pop.remove(), 2400);
}
function showAchievementToast(a){
  const layer = document.getElementById('toastLayer');
  const pop = document.createElement('div');
  pop.className = 'reward-pop';
  pop.style.top = '150px';
  pop.style.borderColor = 'var(--purple-400)';
  pop.innerHTML = `<div class="rcoin">${a.icon}</div><div class="ramt" style="color:var(--purple-600); font-size:15px;">Achievement Unlocked</div><div class="rlbl">${a.title}</div>`;
  layer.appendChild(pop);
  setTimeout(()=>pop.remove(), 2400);
}
function showLevelUp(level){
  const ov = document.createElement('div');
  ov.className='levelup-overlay';
  ov.innerHTML = `<div class="levelup-card">
    <div style="font-size:46px;">🎉</div>
    <h2 style="color:#fff; font-size:24px; margin:10px 0 4px;">Level Up!</h2>
    <div style="font-size:15px; opacity:.9; margin-bottom:18px;">You've reached Level ${level}</div>
    <button class="btn btn-block" style="background:#fff; color:var(--purple-700);" onclick="this.closest('.levelup-overlay').remove()">Continue</button>
  </div>`;
  document.body.appendChild(ov);
  burstConfetti(60);
}
function burstConfetti(n){
  n = n||30;
  const colors=['#8b5fdf','#e8b339','#3fb87f','#5b8def','#e0566b'];
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className='confetti-piece';
    p.style.left = Math.random()*100+'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (1.6+Math.random()*1.2)+'s';
    p.style.opacity = .9;
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 3000);
  }
}
let audioCtx;
function playChime(positive){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type='sine'; o.frequency.value = positive? 880 : 220;
    g.gain.value=0.06;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    o.frequency.exponentialRampToValueAtTime(positive?1320:140, audioCtx.currentTime+0.18);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.3);
    o.stop(audioCtx.currentTime+0.32);
  }catch(e){}
}

/* ---------- ROUTER ---------- */
function go(screen, extra){
  S.screen = screen;
  if(extra) Object.assign(S, extra);
  window.scrollTo(0,0);
  render();
}
function render(){
  const app = document.getElementById('app');
  applyTheme();
  let html = '';
  switch(S.screen){
    case 'landing': html = ScreenLanding(); break;
    case 'onboard1': html = ScreenOnboard1(); break;
    case 'onboard2': html = ScreenOnboard2(); break;
    case 'dashboard': html = ScreenDashboard(); break;
    case 'study': html = ScreenStudyHub(); break;
    case 'studyDetail': html = ScreenStudyDetail(); break;
    case 'doubt': html = ScreenDoubtSolver(); break;
    case 'tests': html = ScreenTestsHub(); break;
    case 'testRunner': html = ScreenTestRunner(); break;
    case 'oralRunner': html = ScreenOralRunner(); break;
    case 'debateLobby': html = ScreenDebateLobby(); break;
    case 'debateRunner': html = ScreenDebateRunner(); break;
    case 'debateResult': html = ScreenDebateResult(); break;
    case 'planner': html = ScreenPlanner(); break;
    case 'progress': html = ScreenProgress(); break;
    case 'profile': html = ScreenProfile(); break;
    default: html = ScreenLanding();
  }
  const needsNav = ['dashboard','study','tests','planner','progress','profile'].includes(S.screen);
  app.innerHTML = html + (needsNav ? BottomNav() : '');
  afterRender();
}
function afterRender(){
  if(typeof window.__afterRenderHook === 'function'){ window.__afterRenderHook(); window.__afterRenderHook=null; }
}

function BottomNav(){
  const items = [
    {id:'dashboard', icon:'🏠', label:'Home'},
    {id:'study', icon:'📚', label:'Study'},
    {id:'tests', icon:'🧪', label:'Tests'},
    {id:'planner', icon:'📅', label:'Planner'},
    {id:'progress', icon:'📊', label:'Progress'},
    {id:'profile', icon:'👤', label:'Profile'},
  ];
  return `<div class="bottomnav">${items.map(it=>`
    <button class="navbtn ${S.screen===it.id?'active':''}" onclick="go('${it.id}')">
      <span class="ni">${it.icon}</span><span>${it.label}</span><span class="nav-dot"></span>
    </button>`).join('')}</div>`;
}

function esc(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
</script>
<script>
/* =========================================================================
   SCREENS: LANDING / ONBOARDING / DASHBOARD
   ========================================================================= */

function ScreenLanding(){
  return `<div class="landing">
    <div class="bg-blob b1"></div><div class="bg-blob b2"></div><div class="bg-blob b3"></div>
    <div class="landing-logo">🎓</div>
    <h1>Pinnacle <span>AI Study</span></h1>
    <p class="tag">Learn Smarter. Level Up Faster.</p>
    <button class="btn btn-primary" style="padding:16px 36px; font-size:16px;" onclick="go('onboard1')">👉 Start Learning</button>
    <div class="landing-pills">
      <div class="landing-pill">🤖 AI Tutor</div>
      <div class="landing-pill">⚖️ AI Debate</div>
      <div class="landing-pill">🪙 YUH Rewards</div>
      <div class="landing-pill">🎤 Oral Exams</div>
    </div>
  </div>`;
}

/* ---------- ONBOARD FORM 1: STUDY PROFILE ---------- */
function ScreenOnboard1(){
  const t = S._tmp.form1 || {name:'', klass:'', board:'', subjects:[], language:''};
  S._tmp.form1 = t;
  return `<div class="scr">
    <div class="step-dots"><div class="step-dot active"></div><div class="step-dot"></div></div>
    <h2 style="text-align:center; margin-bottom:4px;">Set up your study profile</h2>
    <p class="muted" style="text-align:center; font-size:13.5px; margin-bottom:22px;">This stays just between you and Pinnacle</p>

    <div class="field"><label>Your Name</label>
      <input type="text" id="f1name" placeholder="e.g. Aarav Sharma" value="${esc(t.name)}">
    </div>

    <div class="field"><label>Class / Level</label>
      <div class="chip-group" id="f1klass">
        ${CLASS_LIST.map(c=>`<button type="button" class="chip ${t.klass===c?'active':''}" data-val="${esc(c)}" onclick="pickChip('f1klass','${esc(c)}',false)">${c}</button>`).join('')}
      </div>
    </div>

    <div class="field"><label>Board</label>
      <div class="chip-group" id="f1board">
        ${BOARD_LIST.map(c=>`<button type="button" class="chip ${t.board===c?'active':''}" data-val="${esc(c)}" onclick="pickChip('f1board','${esc(c)}',false)">${c}</button>`).join('')}
      </div>
    </div>

    <div class="field"><label>Subjects <span class="muted">(select all that apply)</span></label>
      ${Object.entries(SUBJECT_CATALOG).map(([cat, subs])=>`
        <div class="chip-cat">${cat}</div>
        <div class="chip-group" id="f1subj">
          ${subs.map(s=>`<button type="button" class="chip ${t.subjects.includes(s)?'active':''}" data-val="${esc(s)}" onclick="pickChip('f1subj','${esc(s)}',true)">${s}</button>`).join('')}
        </div>`).join('')}
    </div>

    <div class="field"><label>Language of Study</label>
      <div class="chip-group" id="f1lang">
        ${LANGUAGE_LIST.map(c=>`<button type="button" class="chip ${t.language===c?'active':''}" data-val="${esc(c)}" onclick="pickChip('f1lang','${esc(c)}',false)">${c}</button>`).join('')}
      </div>
    </div>

    <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="submitForm1()">Continue →</button>
  </div>`;
}

function pickChip(groupId, val, multi){
  const t = S._tmp.form1;
  const key = {f1klass:'klass', f1board:'board', f1subj:'subjects', f1lang:'language'}[groupId];

      const scale = Math.min(1, maxW/img.width);
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);

<script>
/* =========================================================================
   AI ENGINE — calls our own /api/ai backend (which talks to OpenAI server-side)
   ========================================================================= */
/* ---------- request pacing + auto-retry (handles platform rate limits gracefully) ---------- */
let __aiLastCallAt = 0;
const __AI_MIN_GAP_MS = 450; // small gap between calls so rapid feature use doesn't burst the rate limit

async function __aiThrottle(){
  const wait = __aiLastCallAt + __AI_MIN_GAP_MS - Date.now();
  if(wait > 0) await new Promise(r=>setTimeout(r, wait));
  __aiLastCallAt = Date.now();
}
function __setAIStatus(text){
  const el = document.getElementById('aiStatusText');
  if(el) el.textContent = text;
}

async function __callBackendAI(messages, maxTokens, _retryCount){
  _retryCount = _retryCount || 0;
  await __aiThrottle();
  let res, data;
  try{
    res = await fetch("/api/ai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: messages, maxTokens: maxTokens || 1000 })
    });
    try{ data = await res.json(); }catch(e){ data = null; }
  }catch(networkErr){
    if(_retryCount < 4){
      __setAIStatus(`Connection issue — retrying (${_retryCount+1}/4)...`);
      await new Promise(r=>setTimeout(r, 800 * Math.pow(2,_retryCount)));
      return __callBackendAI(messages, maxTokens, _retryCount+1);
    }
    throw new Error("Network problem — please check your connection and try again.");
  }

  const isRateLimited = res.status === 429;
  const isServerHiccup = res.status >= 500;

  if((isRateLimited || isServerHiccup) && _retryCount < 4){
    const retryAfter = res.headers.get && res.headers.get('retry-after');
    const backoff = retryAfter ? parseFloat(retryAfter)*1000 : Math.min(9000, 700 * Math.pow(2, _retryCount)) + Math.random()*350;
    __setAIStatus(isRateLimited ? `AI is a bit busy right now — retrying automatically (${_retryCount+1}/4)...` : `Server hiccup — retrying (${_retryCount+1}/4)...`);
    await new Promise(r=>setTimeout(r, backoff));
    return __callBackendAI(messages, maxTokens, _retryCount+1);
  }

  if(!data) throw new Error("Couldn't reach the AI server. Please try again.");
  if(data.error){
    if(isRateLimited) throw new Error("AI is handling a lot of requests right now.");
    throw new Error(data.error || 'AI request failed');
  }
  return (data.text || '').trim();
}

/* ---------- optional backup AI (Gemini) — only used if the user adds their own free key in Profile ---------- */
function __extractPromptForFallback(messages){
  const content = messages[0] && messages[0].content;
  if(typeof content === 'string') return {text: content, image:null};
  if(Array.isArray(content)){
    let text = '', image = null;
    content.forEach(b=>{
      if(b.type==='text') text += (text?'\n':'') + b.text;
      if(b.type==='image' && b.source) image = {mediaType:b.source.media_type, data:b.source.data};
    });
    return {text, image};
  }
  return {text:String(content||''), image:null};
}
async function callGeminiFallback(messages, maxTokens){
  const key = S.profile && S.profile.geminiKey;
  if(!key) return null;
  const {text, image} = __extractPromptForFallback(messages);
  const parts = [{text}];
  if(image) parts.push({inline_data:{mime_type:image.mediaType, data:image.data}});
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ contents:[{parts}], generationConfig:{maxOutputTokens: maxTokens||1000} })
  });
  let data; try{ data = await res.json(); }catch(e){ throw new Error('Backup AI (Gemini) did not respond.'); }
  if(data.error) throw new Error(data.error.message || 'Backup AI (Gemini) request failed');
  const out = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts
    ? data.candidates[0].content.parts.map(p=>p.text||'').join('\n').trim() : '';
  if(!out) throw new Error('Backup AI (Gemini) returned an empty response.');
  return out;
}

async function callAIRaw(messages, maxTokens){
  try{
    return await __callBackendAI(messages, maxTokens, 0);
  }catch(primaryErr){
    if(S.profile && S.profile.geminiKey){
      try{
        __setAIStatus("Primary AI is busy — switching to your backup AI key...");
        const fallbackText = await callGeminiFallback(messages, maxTokens);
        if(fallbackText) return fallbackText;
      }catch(fallbackErr){
        throw new Error(`${primaryErr.message} Backup AI also failed: ${fallbackErr.message}`);
      }
    }
    throw primaryErr;
  }
}

async function callAIText(systemPrompt, userPrompt, maxTokens){
  const combined = `${systemPrompt}\n\n${userPrompt}`;
  return await callAIRaw([{role:'user', content: combined}], maxTokens);
}

function stripJsonFence(text){
  let t = text.trim();
  t = t.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const firstBrace = Math.min(...['[','{'].map(c=>{const i=t.indexOf(c); return i===-1?Infinity:i;}));
  if(firstBrace!==Infinity && firstBrace>0) t = t.slice(firstBrace);
  return t;
}

async function callAIJson(systemPrompt, userPrompt, maxTokens){
  const sys = systemPrompt + "\n\nCRITICAL: Respond with ONLY valid raw JSON. No markdown fences, no preamble, no explanation — just the JSON value itself.";
  const text = await callAIText(sys, userPrompt, maxTokens);
  const cleaned = stripJsonFence(text);
  try{ return JSON.parse(cleaned); }
  catch(e){
    // retry once asking it to fix
    try{
      const fixed = await callAIText("Fix this into strictly valid JSON only, no other text:", cleaned, maxTokens);
      return JSON.parse(stripJsonFence(fixed));
    }catch(e2){ throw new Error('AI returned invalid data. Please try again.'); }
  }
}

async function callAIVision(systemPrompt, userPrompt, imageBase64DataUrl, maxTokens){
  const match = imageBase64DataUrl.match(/^data:(image\/\w+);base64,(.*)$/);
  const mediaType = match ? match[1] : 'image/jpeg';
  const data = match ? match[2] : imageBase64DataUrl;
  const content = [
    { type:'image', source:{ type:'base64', media_type: mediaType, data: data } },
    { type:'text', text: `${systemPrompt}\n\n${userPrompt}` }
  ];
  return await callAIRaw([{role:'user', content}], maxTokens);
}

function chapterCtx(c){
  const p = S.profile;
  return `Student level: ${p.klass}, Board: ${p.board}. Subject: ${c.subject}. Chapter ${c.number?('#'+c.number+' '):''}"${c.name}". ${c.refNotes?('Extra reference from student: '+c.refNotes):''} Respond primarily in ${p.language==='Hinglish'?'Hinglish (Roman Hindi mixed with English, casual student tone)':p.language}. Keep it accurate, age-appropriate, and exam-relevant.`;
}

      ${STUDY_TABS.map(t=>`<button class="chip ${t.id===tab?'active':''}" onclick="go('studyDetail',{_tab:'${t.id}'})">${t.icon} ${t.title}</button>`).join('')}
    </div>
    <div id="studyContentArea">${renderStudyTabContent(c, tab, content)}</div>
  </div>`;
}

function renderStudyTabContent(c, tab, content){
  if(tab==='summary') return renderSummaryTab(c, content);
  if(tab==='notes') return renderNotesTab(c, content);
  if(tab==='concepts') return renderConceptsTab(c, content);
  if(tab==='definitions') return renderDefinitionsTab(c, content);
  if(tab==='formulas') return renderFormulasTab(c, content);
  if(tab==='flashcards') return renderFlashcardsTab(c, content);
  return '';
}

function genBtn(label, onclick){
  return `<div class="empty-state"><div class="ei">✨</div><p style="margin-bottom:16px;">${label}</p>
    <button class="btn btn-primary" onclick="${onclick}">Generate with AI</button></div>`;
}
function loadingBlock(){
  return `<div class="ai-loading"><div class="spinner"></div><div class="muted" id="aiStatusText" style="font-size:13.5px;">AI is thinking...</div></div>`;
}
async function runGen(fn){
  document.getElementById('studyContentArea').innerHTML = loadingBlock();
  try{ await fn(); render(); }
  catch(e){ document.getElementById('studyContentArea').innerHTML = `<div class="empty-state"><div class="ei">⚠️</div><p>${esc(e.message)}</p><button class="btn btn-secondary" onclick="render()">Back</button></div>`; }
}

/* SUMMARY */
function renderSummaryTab(c, content){
  if(!content.summary) return genBtn('Get an AI-generated overview of this chapter.', `runGen(genSummary)`);
  return `<div class="card content-block"><div class="ai-bubble">${esc(content.summary).replace(/\n/g,'<br>')}</div></div>
    <button class="btn btn-secondary btn-sm" onclick="runGen(genSummary)">↻ Regenerate</button>`;
}
async function genSummary(){
  const c = S.chapters.find(ch=>ch.id===S.activeChapterId);
  const text = await callAIText("You are an expert teacher writing a concise chapter summary for a student.", `${chapterCtx(c)}\n\nWrite a clear 150-200 word summary of this chapter covering the main ideas a student must know.`, 500);
  S.studyContent[c.id] = S.studyContent[c.id] || {};
  S.studyContent[c.id].summary = text;
  await persistContent();
  await grantYuh(5, "Summary Generated");
}

/* NOTES */
function renderNotesTab(c, content){
  if(!content.notes) return genBtn('Generate quick exam-ready notes.', `runGen(genNotes)`);
  return `<div class="card content-block"><div class="ai-bubble">${esc(content.notes).replace(/\n/g,'<br>')}</div></div>
    <button class="btn btn-secondary btn-sm" onclick="runGen(genNotes)">↻ Regenerate</button>`;
}
async function genNotes(){
  const c = S.chapters.find(ch=>ch.id===S.activeChapterId);
  const text = await callAIText("You are a top student creating crisp bullet-point revision notes.", `${chapterCtx(c)}\n\nGenerate well-structured bullet-point notes (use • for bullets, group under short bold-ish headings using CAPS) covering all key points for fast exam revision.`, 700);
  S.studyContent[c.id] = S.studyContent[c.id] || {};
  S.studyContent[c.id].notes = text;
  await persistContent();
  await grantYuh(10, "Notes Created");
}

/* CONCEPTS */
function renderConceptsTab(c, content){
  const mode = S._tmp.conceptMode || 'beginner';
  const key = mode==='beginner' ? 'concepts_beg' : 'concepts_adv';
  const body = content[key]
    ? `<div class="card content-block"><div class="ai-bubble">${esc(content[key]).replace(/\n/g,'<br>')}</div></div><button class="btn btn-secondary btn-sm" onclick="runGen(()=>genConcepts('${mode}'))">↻ Regenerate</button>`
    : genBtn(`Explain this chapter in ${mode} mode.`, `runGen(()=>genConcepts('${mode}'))`);
  return `<div class="toggle-row">
    <button class="${mode==='beginner'?'active':''}" onclick="setConceptMode('beginner')">🌱 Beginner</button>
    <button class="${mode==='advanced'?'active':''}" onclick="setConceptMode('advanced')">🚀 Advanced</button>
  </div>${body}`;
}
function setConceptMode(m){ S._tmp.conceptMode = m; render(); }
async function genConcepts(mode){
  const c = S.chapters.find(ch=>ch.id===S.activeChapterId);
  const level = mode==='beginner' ? 'Explain like the student is seeing this topic for the first time — simple words, relatable analogies, step by step.' : 'Explain at an advanced, exam-competitive depth — include nuances, edge cases, and how examiners twist questions on this topic.';
  const text = await callAIText("You are an expert concept teacher.", `${chapterCtx(c)}\n\n${level}\nKeep it to 180-250 words.`, 600);
  S.studyContent[c.id] = S.studyContent[c.id] || {};
  S.studyContent[c.id][mode==='beginner'?'concepts_beg':'concepts_adv'] = text;
  await persistContent();
  await grantYuh(5, "Concept Unlocked");
}

/* DEFINITIONS */
function renderDefinitionsTab(c, content){
  if(!content.definitions || !content.definitions.length) return genBtn('Build a searchable glossary for this chapter.', `runGen(genDefinitions)`);
  return `<input type="text" placeholder="🔍 Search terms..." style="width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--grey-200); background:var(--grey-50); margin-bottom:12px;" oninput="filterDefs(this.value)">
    <div id="defsList">${content.definitions.map((d,i)=>`<div class="card content-block def-item" data-term="${esc(d.term.toLowerCase())}"><div style="font-weight:700; color:var(--purple-700); margin-bottom:4px;">${esc(d.term)}</div><div style="font-size:13.5px; color:var(--grey-700);">${esc(d.definition)}</div></div>`).join('')}</div>
    <button class="btn btn-secondary btn-sm" onclick="runGen(genDefinitions)">↻ Regenerate</button>`;
}
function filterDefs(q){
  q = q.toLowerCase();
  document.querySelectorAll('.def-item').forEach(el=>{ el.style.display = el.dataset.term.includes(q) ? '' : 'none'; });
}
async function genDefinitions(){
  const c = S.chapters.find(ch=>ch.id===S.activeChapterId);
  const data = await callAIJson("You are building a glossary for students.", `${chapterCtx(c)}\n\nReturn a JSON array of 8-12 important terms from this chapter as [{"term":"...", "definition":"..."}]. Definitions must be short (max 25 words) and clear.`, 900);
  S.studyContent[c.id] = S.studyContent[c.id] || {};
  S.studyContent[c.id].definitions = Array.isArray(data) ? data : [];
  await persistContent();
  await grantYuh(5, "Glossary Built");
}

/* FORMULA SHEET */
function renderFormulasTab(c, content){
  if(!content.formulas || !content.formulas.length) return genBtn('Generate a quick-reference formula sheet.', `runGen(genFormulas)`);
  return content.formulas.map(f=>`<div class="card content-block">
      <div style="font-family:var(--font-mono); font-weight:700; color:var(--purple-700); font-size:15px; margin-bottom:5px;">${esc(f.formula)}</div>
      <div style="font-weight:600; font-size:13px; margin-bottom:3px;">${esc(f.name)}</div>
      <div class="muted" style="font-size:12px;">${esc(f.usage)}</div>
    </div>`).join('') + `<button class="btn btn-secondary btn-sm" onclick="runGen(genFormulas)">↻ Regenerate</button>`;
}
async function genFormulas(){
  const c = S.chapters.find(ch=>ch.id===S.activeChapterId);
  const data = await callAIJson("You are building a formula / key-framework reference sheet.", `${chapterCtx(c)}\n\nReturn a JSON array [{"name":"...", "formula":"...", "usage":"one-line note on when/how to use it"}] with 5-10 of the most important formulas or key frameworks for this chapter. If this subject genuinely has no formulas (e.g. literature), instead return key frameworks/structures students should memorize in the same JSON shape.`, 900);
  S.studyContent[c.id] = S.studyContent[c.id] || {};
  S.studyContent[c.id].formulas = Array.isArray(data) ? data : [];
  await persistContent();
  await grantYuh(25, "Formula Sheet Ready");
}

/* FLASHCARDS */
function renderFlashcardsTab(c, content){
  if(!content.flashcards || !content.flashcards.length) return genBtn('Auto-generate flip flashcards for this chapter.', `runGen(genFlashcards)`);
  const idx = S._tmp.flashIdx || 0;
  const card = content.flashcards[idx];
  return `<div class="muted" style="text-align:center; font-size:12.5px; margin-bottom:6px;">Card ${idx+1} of ${content.flashcards.length} · tap to flip</div>
    <div class="flash-stage"><div class="flash-card ${S._tmp.flashFlipped?'flipped':''}" onclick="flipFlash()">
      <div class="flash-face flash-front">${esc(card.front)}</div>
      <div class="flash-face flash-back">${esc(card.back)}</div>
    </div></div>
    <div class="row gap-12" style="margin-top:14px;">
      <button class="btn btn-secondary" style="flex:1;" onclick="navFlash(-1)">← Prev</button>
      <button class="btn btn-primary" style="flex:1;" onclick="navFlash(1)">Next →</button>
    </div>
    <button class="btn btn-secondary btn-sm" style="margin-top:10px;" onclick="runGen(genFlashcards)">↻ Regenerate Set</button>`;
}
function flipFlash(){ S._tmp.flashFlipped = !S._tmp.flashFlipped; render(); }
function navFlash(dir){
  const c = S.chapters.find(ch=>ch.id===S.activeChapterId);
  const len = S.studyContent[c.id].flashcards.length;
  S._tmp.flashIdx = ((S._tmp.flashIdx||0) + dir + len) % len;
  S._tmp.flashFlipped = false;
  render();
}
async function genFlashcards(){
  const c = S.chapters.find(ch=>ch.id===S.activeChapterId);
  const data = await callAIJson("You are creating spaced-repetition flashcards.", `${chapterCtx(c)}\n\nReturn a JSON array of 10 flashcards [{"front":"question or term","back":"concise answer"}] covering this chapter.`, 900);
  S.studyContent[c.id] = S.studyContent[c.id] || {};
  S.studyContent[c.id].flashcards = Array.isArray(data) ? data : [];
  S._tmp.flashIdx = 0; S._tmp.flashFlipped = false;
  await persistContent();
  await grantYuh(10, "Flashcards Ready");
}
</script>

<script>
/* =========================================================================
   AI DOUBT SOLVER
   ========================================================================= */
function ScreenDoubtSolver(){
  S._tmp.doubt = S._tmp.doubt || {mode:'text', history:[], image:null};
  const d = S._tmp.doubt;
  return `<div class="topbar"><button class="back-btn" onclick="go('study')">←</button><h2>AI Doubt Solver</h2><div style="width:38px;"></div></div>
  <div class="scr" style="padding-top:6px;">
    <div class="toggle-row">
      <button class="${d.mode==='text'?'active':''}" onclick="setDoubtMode('text')">⌨️ Text</button>
      <button class="${d.mode==='voice'?'active':''}" onclick="setDoubtMode('voice')">🎤 Voice</button>
      <button class="${d.mode==='image'?'active':''}" onclick="setDoubtMode('image')">📷 Image</button>
    </div>

    <div id="doubtHistory">${d.history.map(h=>`
      <div class="card content-block" style="background:var(--purple-50); border:none;"><div style="font-weight:700; font-size:12px; color:var(--purple-600); margin-bottom:4px;">YOU ASKED</div>${h.img?`<img src="${h.img}" style="max-width:140px;border-radius:10px;margin-bottom:6px;">`:''}<div style="font-size:13.5px;">${esc(h.q)}</div></div>
      <div class="card content-block"><div style="font-weight:700; font-size:12px; color:var(--grey-500); margin-bottom:4px;">🤖 STEP-BY-STEP ANSWER</div><div class="ai-bubble" style="background:transparent; padding:0;">${esc(h.a).replace(/\n/g,'<br>')}</div></div>
    `).join('')}</div>
    <div id="doubtStatus"></div>

    ${d.mode==='text' ? `
      <div class="field"><textarea id="doubtInput" placeholder="Type your doubt here..."></textarea></div>
      <button class="btn btn-primary btn-block" onclick="submitDoubt('text')">Ask AI Tutor</button>
    ` : ''}
    ${d.mode==='voice' ? `
      <div style="text-align:center; margin:20px 0;">
        <button class="mic-btn" id="micBtn" onclick="toggleVoiceDoubt()">🎤</button>
        <div class="muted" id="voiceStatus" style="margin-top:10px; font-size:13px;">Tap to speak your doubt</div>
      </div>
    ` : ''}
    ${d.mode==='image' ? `
      <div class="field"><input type="file" accept="image/*" id="doubtImgInput" onchange="handleDoubtImage(event)"></div>
      <div id="doubtImgPreview"></div>
      <div class="field"><textarea id="doubtImgQuestion" placeholder="What should I solve in this image? (optional)"></textarea></div>
      <button class="btn btn-primary btn-block" id="doubtImgSubmitBtn" onclick="submitDoubt('image')" disabled>Upload an image first</button>
    ` : ''}
  </div>`;
}
function setDoubtMode(m){ S._tmp.doubt.mode = m; render(); }

async function submitDoubt(kind){
  const d = S._tmp.doubt;
  let question, imgData=null;
  if(kind==='text'){ question = document.getElementById('doubtInput').value.trim(); if(!question) return; }
  if(kind==='image'){
    question = document.getElementById('doubtImgQuestion').value.trim() || "Please solve / explain what's shown in this image, step by step.";
    imgData = d._pendingImg;
    if(!imgData){ alert('Pehle image upload karo'); return; }
  }
  document.getElementById('doubtStatus').innerHTML = loadingBlock();
  try{
    const sys = `You are a patient AI tutor for a ${S.profile.klass} student (${S.profile.board} board). Respond in ${S.profile.language}. Give clear step-by-step explanations.`;
    let answer;
    if(kind==='image') answer = await callAIVision(sys, question, imgData, 800);
    else answer = await callAIText(sys, question, 800);
    d.history.unshift({q:question, a:answer, img:imgData});
    d._pendingImg = null;
    await grantYuh(2, "Doubt Solved");
    render();
  }catch(e){
    document.getElementById('doubtStatus').innerHTML = `<div class="muted" style="color:var(--red); font-size:13px;">⚠️ ${esc(e.message)}</div>`;
  }
}

function handleDoubtImage(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      const scale = Math.min(1, 700/img.width);
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      S._tmp.doubt._pendingImg = dataUrl;
      document.getElementById('doubtImgPreview').innerHTML = `<img src="${dataUrl}" style="width:100%; max-height:160px; object-fit:cover; border-radius:12px; margin-bottom:10px;">`;
      const btn = document.getElementById('doubtImgSubmitBtn'); btn.disabled=false; btn.textContent='Ask AI Tutor';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* voice doubt via Web Speech API, graceful fallback */
let doubtRecognition = null;
function toggleVoiceDoubt(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ document.getElementById('voiceStatus').textContent = "Voice input isn't supported on this browser — try Text mode."; return; }
  const micBtn = document.getElementById('micBtn');
  if(doubtRecognition){ doubtRecognition.stop(); return; }
  doubtRecognition = new SR();
  doubtRecognition.lang = S.profile.language==='Hindi' ? 'hi-IN' : 'en-IN';
  doubtRecognition.interimResults = false;
  micBtn.classList.add('listening');
  document.getElementById('voiceStatus').textContent = "Listening...";
  doubtRecognition.onresult = (ev)=>{
    const transcript = ev.results[0][0].transcript;
    document.getElementById('voiceStatus').textContent = `"${transcript}"`;
    S._tmp.doubt._voiceQ = transcript;
    askVoiceDoubt(transcript);
  };
  doubtRecognition.onerror = ()=>{ document.getElementById('voiceStatus').textContent = "Didn't catch that — try again or switch to Text mode."; };
  doubtRecognition.onend = ()=>{ micBtn.classList.remove('listening'); doubtRecognition=null; };
  doubtRecognition.start();
}
async function askVoiceDoubt(text){
  const d = S._tmp.doubt;
  document.getElementById('doubtStatus').innerHTML = loadingBlock();
  try{
    const sys = `You are a patient AI tutor for a ${S.profile.klass} student (${S.profile.board} board). Respond in ${S.profile.language}. Give clear step-by-step explanations.`;
    const answer = await callAIText(sys, text, 800);
    d.history.unshift({q:text, a:answer, img:null});
    await grantYuh(2, "Doubt Solved");
    render();
  }catch(e){ document.getElementById('doubtStatus').innerHTML = `<div class="muted" style="color:var(--red);">⚠️ ${esc(e.message)}</div>`; }
}
</script>

<script>
/* =========================================================================
   TEST SYSTEM — Written (MCQ / Short / Long / Book Exercise) + Oral
   ========================================================================= */
const WRITTEN_TYPES = [
  {id:'mcq', icon:'☑️', label:'MCQ Test', sub:'10 questions', n:10},
  {id:'short', icon:'✏️', label:'Short Answer', sub:'5 questions', n:5},
  {id:'long', icon:'📜', label:'Long Answer', sub:'3 questions', n:3},
  {id:'book', icon:'📘', label:'Book Exercise Style', sub:'6 questions', n:6},
];

function ScreenTestsHub(){
  if(S.chapters.length===0){
    return `<div class="topbar"><h2>Tests</h2></div><div class="scr"><div class="empty-state"><div class="ei">🧪</div><p>Add a chapter first from the Study tab to unlock tests.</p><button class="btn btn-primary" onclick="go('study')">Go to Study</button></div></div>`;
  }
  if(!S.activeChapterId) S.activeChapterId = S.chapters[S.chapters.length-1].id;
  const active = S.chapters.find(c=>c.id===S.activeChapterId);
  const history = S.testHistory.slice(-5).reverse();

  return `<div class="topbar"><h2>Tests</h2></div>

      ${S.chapters.map(c=>`<button class="chip ${c.id===S.activeChapterId?'active':''}" onclick="S.activeChapterId='${c.id}'; render();">${esc(c.name)}</button>`).join('')}
    </div>

    <div class="section-title">📘 Written Test Mode</div>
    <div class="feat-grid">
      ${WRITTEN_TYPES.map(w=>`<div class="feat-card" onclick="startWrittenTest('${w.id}')">
        <div class="fi" style="background:var(--purple-100); color:var(--purple-700);">${w.icon}</div>
        <div class="ft">${w.label}</div><div class="fs">${w.sub}</div>
      </div>`).join('')}
    </div>

    <div class="section-title">🎤 Oral Test Mode (AI Voice Exam)</div>
    <div class="card tap" style="display:flex; align-items:center; gap:14px;" onclick="startOralTest()">
      <div class="fi" style="background:#e8b3391a; color:var(--gold-deep); width:46px; height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:22px;">🎤</div>
      <div style="flex:1;"><div style="font-weight:700; font-size:14px;">Start Oral Exam</div><div class="muted" style="font-size:12px;">AI asks aloud · you answer by voice in 10s</div></div>
      <div style="font-size:18px;">→</div>

    <div class="section-title">Recent Results</div>
    ${history.length===0? `<div class="card" style="text-align:center; color:var(--grey-500); font-size:13px;">No tests attempted yet</div>` :
      history.map(h=>`<div class="task-item"><div class="task-check done">${Math.round(h.score)>=50?'✓':'✗'}</div><div style="flex:1;"><div style="font-weight:600; font-size:13px;">${esc(h.label)}</div><div class="muted" style="font-size:11px;">${esc(h.chapterName)}</div></div><div style="font-weight:800; font-family:var(--font-mono);">${Math.round(h.score)}%</div></div>`).join('')}

}

/* ---------- WRITTEN TEST RUNNER ---------- */
async function startWrittenTest(typeId){
  const c = S.chapters.find(ch=>ch.id===S.activeChapterId);
  const wt = WRITTEN_TYPES.find(w=>w.id===typeId);
  go('testRunner', {_test:{kind:'written', typeId, chapterId:c.id, status:'loading', qIndex:0, answers:[], score:null}});
  try{
    let data;
    if(typeId==='mcq'){
      data = await callAIJson("You write rigorous school exam MCQs.", `${chapterCtx(c)}\n\nReturn JSON array of ${wt.n} MCQs: [{"q":"...","options":["A","B","C","D"],"answerIndex":0,"explain":"<=12 word reason"}]. answerIndex is 0-based index of the correct option.`, 1000);
    } else if(typeId==='short'){
      data = await callAIJson("You write short-answer exam questions.", `${chapterCtx(c)}\n\nReturn JSON array of ${wt.n} short-answer questions: [{"q":"...","modelAnswer":"<=35 words ideal answer"}].`, 900);
    } else if(typeId==='long'){
      data = await callAIJson("You write long-answer exam questions.", `${chapterCtx(c)}\n\nReturn JSON array of ${wt.n} long-answer questions: [{"q":"...","modelAnswer":"<=70 words covering key points an ideal answer should hit"}].`, 900);
    } else {
      data = await callAIJson("You write textbook-style exercise questions like NCERT book exercises.", `${chapterCtx(c)}\n\nReturn JSON array of ${wt.n} book-exercise-style questions mixing short numerical/conceptual style: [{"q":"...","modelAnswer":"<=40 words ideal answer"}].`, 900);
    }
    S._test.status = 'active';
    S._test.questions = Array.isArray(data) ? data : [];
    if(S._test.questions.length===0) throw new Error("AI couldn't generate questions. Try again.");
    render();
  }catch(e){
    S._test.status = 'error'; S._test.error = e.message; render();
  }
}

function ScreenTestRunner(){
  const t = S._test;
  const c = S.chapters.find(ch=>ch.id===t.chapterId);
  if(t.status==='loading') return `<div class="topbar"><button class="back-btn" onclick="go('tests')">←</button><h2>Preparing Test</h2><div style="width:38px;"></div></div><div class="scr">${loadingBlock()}</div>`;
  if(t.status==='grading') return `<div class="topbar"><h2>Grading</h2></div><div class="scr"><div class="ai-loading"><div class="spinner"></div><div class="muted" id="aiStatusText" style="font-size:13.5px;">AI examiner is grading your answers...</div></div></div>`;
  if(t.status==='error') return `<div class="topbar"><button class="back-btn" onclick="go('tests')">←</button><h2>Test</h2><div style="width:38px;"></div></div><div class="scr"><div class="empty-state"><div class="ei">⚠️</div><p>${esc(t.error)}</p><button class="btn btn-primary" onclick="startWrittenTest('${t.typeId}')">Retry</button></div></div>`;
  if(t.status==='done') return renderWrittenResult(t, c);

  const q = t.questions[t.qIndex];
  const isMcq = t.typeId==='mcq';
  return `<div class="topbar"><button class="back-btn" onclick="go('tests')">←</button><h2>Q${t.qIndex+1}/${t.questions.length}</h2><div style="width:38px;"></div></div>
  <div class="scr" style="padding-top:6px;">
    <div class="progress-track" style="margin-bottom:18px;"><div class="progress-fill" style="width:${(t.qIndex/t.questions.length)*100}%"></div></div>
    <div class="card" style="margin-bottom:16px;"><div style="font-size:15.5px; font-weight:600; line-height:1.5;">${esc(q.q)}</div></div>
    ${isMcq ? `
      <div id="mcqOpts">${q.options.map((op,i)=>`<div class="mcq-opt" data-i="${i}" onclick="selectMcq(${i})"><div class="mcq-letter">${String.fromCharCode(65+i)}</div><div>${esc(op)}</div></div>`).join('')}</div>
      <button class="btn btn-primary btn-block" id="mcqNextBtn" style="margin-top:10px;" onclick="nextWrittenQ()" disabled>Submit Answer</button>
    ` : `
      <textarea id="writtenAns" placeholder="Type your answer here..." style="width:100%; min-height:120px; padding:14px; border-radius:14px; border:1.5px solid var(--grey-200); background:var(--grey-50);"></textarea>
      <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="nextWrittenQ()">Submit Answer</button>
    `}
  </div>`;
}
function selectMcq(i){
  document.querySelectorAll('.mcq-opt').forEach(el=>el.classList.remove('sel'));
  document.querySelector(`.mcq-opt[data-i="${i}"]`).classList.add('sel');
  document.getElementById('mcqNextBtn').disabled = false;
  S._tmp.mcqSel = i;
}
async function nextWrittenQ(){
  const t = S._test;
  const isMcq = t.typeId==='mcq';
  if(isMcq){
    t.answers.push({selected:S._tmp.mcqSel});
    S._tmp.mcqSel = null;
  } else {
    const val = document.getElementById('writtenAns').value.trim();
    t.answers.push({text:val});
  }
  if(t.qIndex < t.questions.length-1){
    t.qIndex++; render();
  } else {
    await finishWrittenTest();
  }
}
async function finishWrittenTest(){
  const t = S._test;
  const c = S.chapters.find(ch=>ch.id===t.chapterId);
  t.status='grading'; render();
  let totalScore=0;
  if(t.typeId==='mcq'){
    let correct=0;
    t.questions.forEach((q,i)=>{ if(t.answers[i] && t.answers[i].selected===q.answerIndex) correct++; });
    totalScore = (correct/t.questions.length)*100;
    t.perQuestionScore = t.questions.map((q,i)=>({correct: t.answers[i] && t.answers[i].selected===q.answerIndex, explain:q.explain, answerIndex:q.answerIndex, selected:t.answers[i]?t.answers[i].selected:null}));
  } else {
    try{
      const gradePrompt = t.questions.map((q,i)=>`Q${i+1}: ${q.q}\nModel Answer: ${q.modelAnswer}\nStudent Answer: ${t.answers[i].text || '(blank)'}`).join('\n\n');
      const data = await callAIJson("You are a strict but fair exam grader.", `Grade each student answer against the model answer on a 0-100 scale for correctness/completeness. Return JSON array [{"score":0-100,"feedback":"<=15 words"}] in the same order.\n\n${gradePrompt}`, 900);
      t.gradeResults = data;
      totalScore = data.reduce((a,b)=>a+(b.score||0),0)/data.length;
    }catch(e){
      totalScore = 0; t.gradeResults = t.questions.map(()=>({score:0, feedback:"Could not auto-grade — review manually."}));
    }
  }
  t.score = totalScore;
  t.status='done';
  const wtLabel = WRITTEN_TYPES.find(w=>w.id===t.typeId).label;
  S.testHistory.push({id:uid(), chapterId:c.id, chapterName:c.name, type:t.typeId, label:wtLabel, score:totalScore, date:new Date().toISOString()});
  await persistTests();
  let yuh = Math.round(50 * (totalScore/100)) || 5;
  await grantYuh(Math.max(yuh,5), `${wtLabel} Completed`);
  await checkAchievements();
  render();
}
function render0Loading(){ const app=document.getElementById('app'); /* no-op placeholder to keep UI calm during grading */ }

function renderWrittenResult(t, c){
  const wtLabel = WRITTEN_TYPES.find(w=>w.id===t.typeId).label;
  return `<div class="topbar"><button class="back-btn" onclick="go('tests')">←</button><h2>Result</h2><div style="width:38px;"></div></div>
  <div class="scr">
    <div class="card glass" style="text-align:center; padding:28px 18px;">
      <div style="font-size:13px; color:var(--grey-500); margin-bottom:6px;">${esc(wtLabel)} · ${esc(c.name)}</div>
      <div style="font-size:42px; font-weight:800; color:var(--purple-700);">${Math.round(t.score)}%</div>
      <div class="muted" style="margin-top:4px;">${t.score>=70?'Excellent work! 🎉':t.score>=40?'Good effort, keep practicing':'Needs more revision — try the AI Doubt Solver'}</div>
    </div>
    <div class="section-title">Question Breakdown</div>

        <div style="font-weight:600; font-size:13.5px; margin-bottom:6px;">${i+1}. ${esc(q.q)}</div>
        <div style="font-size:12.5px; color:${r.correct?'var(--green)':'var(--red)'}; font-weight:700;">${r.correct?'✓ Correct':'✗ Incorrect — answer: '+esc(q.options[q.answerIndex])}</div>
        <div class="muted" style="font-size:11.5px; margin-top:3px;">${esc(q.explain||'')}</div>
      </div>`;}).join('')
      :
      t.questions.map((q,i)=>{const g=t.gradeResults[i]||{score:0,feedback:''}; return `<div class="card content-block">
        <div style="font-weight:600; font-size:13.5px; margin-bottom:6px;">${i+1}. ${esc(q.q)}</div>
        <div style="font-size:12.5px; font-weight:700; color:var(--purple-600);">Score: ${Math.round(g.score)}%</div>
        <div class="muted" style="font-size:11.5px; margin-top:3px;">${esc(g.feedback)}</div>
